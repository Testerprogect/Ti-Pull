<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>TI-84 CE — DUSB Directory Probe (mode negotiation)</title>
<style>
  body{font-family:system-ui,Segoe UI,Roboto,Arial;margin:0;background:linear-gradient(135deg,#eef4ff,#f7fbff);color:#0b2436}
  .app{max-width:980px;margin:28px auto;background:#fff;border-radius:12px;padding:18px;box-shadow:0 10px 30px rgba(20,40,80,.08)}
  header{display:flex;justify-content:space-between;align-items:center}
  h1{margin:0;font-size:18px}
  button{padding:10px 14px;border-radius:8px;border:0;background:#3f61d7;color:#fff;font-weight:700;cursor:pointer}
  button.ghost{background:#fff;border:1px solid #e6edf9;color:#2b3a57}
  .log{margin-top:14px;background:#071426;color:#dbeeff;padding:12px;border-radius:8px;min-height:200px;white-space:pre-wrap;font-family:ui-monospace,monospace}
  textarea.raw{width:100%;height:140px;margin-top:12px;font-family:ui-monospace,monospace}
  .note{color:#516a80;font-size:13px;margin-top:8px}
</style>
</head>
<body>
  <div class="app">
    <header>
      <div>
        <h1>TI-84 CE — DUSB Directory Probe (mode negotiation)</h1>
        <div class="note">This implements the DUSB/CARS mode negotiation (PING → MODE_SET) before DIR_REQ.</div>
      </div>
      <div>
        <button id="connect">Connect</button>
        <button id="dir" class="ghost" disabled>Get Directory</button>
        <button id="disconnect" class="ghost" disabled>Disconnect</button>
      </div>
    </header>

    <div id="deviceInfo" style="margin-top:12px;color:#556b80">No device</div>

    <h3 style="margin-top:14px">Debug Log</h3>
    <div id="log" class="log">No activity yet.</div>
    <h3 style="margin-top:12px">Latest raw / virtual data</h3>
    <textarea id="raw" class="raw" readonly placeholder="Raw hex dump will appear here"></textarea>
  </div>

<script>
"use strict";

/* constants from ticalc-usb magic-values.js */
const v = {
  rawPacketTypes: {
    DUSB_RPKT_BUF_SIZE_REQ:    1,
    DUSB_RPKT_BUF_SIZE_ALLOC:  2,
    DUSB_RPKT_VIRT_DATA:       3,
    DUSB_RPKT_VIRT_DATA_LAST:  4,
    DUSB_RPKT_VIRT_DATA_ACK:   5,
    HEADER_SIZE:               4 + 1
  },
  virtualPacketTypes: {
    DUSB_VPKT_PING:            0x0001,
    DUSB_VPKT_OS_BEGIN:        0x0002,
    DUSB_VPKT_OS_ACK:          0x0003,
    DUSB_VPKT_OS_HEADER:       0x0004,
    DUSB_VPKT_OS_DATA:         0x0005,
    DUSB_VPKT_EOT_ACK:         0x0006,
    DUSB_VPKT_PARM_REQ:        0x0007,
    DUSB_VPKT_PARM_DATA:       0x0008,
    DUSB_VPKT_DIR_REQ:         0x0009,
    DUSB_VPKT_VAR_HDR:         0x000A,
    DUSB_VPKT_RTS:             0x000B,
    DUSB_VPKT_VAR_REQ:         0x000C,
    DUSB_VPKT_VAR_CNTS:        0x000D,
    DUSB_VPKT_PARM_SET:        0x000E,
    DUSB_VPKT_MODIF_VAR:       0x0010,
    DUSB_VPKT_EXECUTE:         0x0011,
    DUSB_VPKT_MODE_SET:        0x0012,
    DUSB_VPKT_DATA_ACK:        0xAA00,
    DUSB_VPKT_DELAY_ACK:       0xBB00,
    DUSB_VPKT_EOT:             0xDD00,
    DUSB_VPKT_ERROR:           0xEE00,
    HEADER_SIZE:               4 + 2
  },
  modes: {
    DUSB_MODE_NORMAL:          [ 0,3, 0,1, 0,0, 0,0, 0x07,0xd0 ]
  }
};

/* byte helpers (from byte-mangling.js) */
function intToBytes(num, length) {
  const bytes = [];
  while (length > 0) {
    length--;
    bytes.push((num / Math.pow(256, length)) & 0xFF);
  }
  return bytes;
}
function bytesToInt(bytes) {
  let length = bytes.length;
  let result = 0;
  let i = 0;
  while (length > 0) {
    length--;
    result += (bytes[i++] & 0xFF) * Math.pow(256, length);
  }
  return result;
}
function constructPacket(packet, typeSize) {
  const size = packet.data && packet.data.length || 0;
  const header = intToBytes(size, 4);
  header.splice(4, 0, ...intToBytes(packet.type, typeSize));
  const result = new Uint8Array(header.length + size);
  result.set(header);
  result.set(packet.data || [], header.length);
  return result;
}
function constructRawPacket(packet) { return constructPacket(packet, 1); }
function constructVirtualPacket(packet) { return constructPacket(packet, 2); }
function destructRawPacket(packet) {
  return {
    size: bytesToInt(packet.slice(0,4)),
    type: packet[4],
    data: packet.slice(5)
  };
}
function destructVirtualPacket(packet) {
  return {
    size: bytesToInt(packet.slice(0,4)),
    type: bytesToInt(packet.slice(4,6)),
    data: packet.slice(6)
  };
}
function chunkArray(array, sizes) {
  const result = [];
  let i, j = 0;
  for (i = 0; i < sizes.length; i++) {
    result.push(array.slice(j, j + sizes[i]));
    j += sizes[i];
    if (j >= array.length) return result;
  }
  i--;
  while (j < array.length) {
    result.push(array.slice(j, j + sizes[i]));
    j += sizes[i];
  }
  return result;
}

/* UI */
const $ = id => document.getElementById(id);
const logEl = $("log"), rawEl = $("raw"), deviceInfo = $("deviceInfo");
function log(msg) { const t=new Date().toLocaleTimeString(); logEl.textContent += `[${t}] ${msg}\n`; logEl.scrollTop = logEl.scrollHeight; console.log(msg); }
function hexDump(bytes) {
  if (!bytes || bytes.length===0) return "(empty)";
  let out="";
  for (let i=0;i<bytes.length;i+=16){
    const chunk = bytes.slice(i,i+16);
    const hex = Array.from(chunk).map(b=>b.toString(16).padStart(2,'0').toUpperCase()).join(' ');
    const ascii = Array.from(chunk).map(b=> (b>=32 && b<=126) ? String.fromCharCode(b) : '.').join('');
    out += i.toString(16).padStart(8,'0') + '  ' + hex.padEnd(47,' ') + '  ' + ascii + '\n';
  }
  return out;
}
function bytesToHexInline(bytes){ return Array.from(bytes||[]).map(b=>b.toString(16).padStart(2,'0').toUpperCase()).join(' '); }

/* device state */
let device = null, inEp = null, outEp = null, bufferSize = 64;

async function openAndClaim(dev) {
  await dev.open();
  if (dev.configuration === null) await dev.selectConfiguration(1);
  const iface = dev.configuration.interfaces[0];
  await dev.claimInterface(iface.interfaceNumber);
  const alt = iface.alternates[0];
  inEp = alt.endpoints.find(e=>e.direction==='in');
  outEp = alt.endpoints.find(e=>e.direction==='out');
  if (!inEp || !outEp) throw new Error('Could not find IN and OUT endpoints');
  log(`Claimed iface ${iface.interfaceNumber} IN=${inEp.endpointNumber} OUT=${outEp.endpointNumber}`);
}

async function transferOutRaw(buffer) {
  await device.transferOut(outEp.endpointNumber, buffer);
  log('transferOut -> ' + bytesToHexInline(buffer));
}
async function transferInRaw(timeoutMs=1200) {
  try {
    const res = await Promise.race([
      device.transferIn(inEp.endpointNumber, 4096),
      new Promise((_,reject)=>setTimeout(()=>reject(new Error('transferIn timeout')), timeoutMs))
    ]);
    if (!res || !res.data) return new Uint8Array();
    const bytes = new Uint8Array(res.data.buffer, res.data.byteOffset, res.data.byteLength);
    log('transferIn <- ' + bytesToHexInline(bytes));
    return bytes;
  } catch(e) {
    return new Uint8Array();
  }
}

/* DUSB steps */

// 1: request buffer size
async function requestBufferSize() {
  log('Requesting buffer size (DUSB_RPKT_BUF_SIZE_REQ)...');
  const req = constructRawPacket({ type: v.rawPacketTypes.DUSB_RPKT_BUF_SIZE_REQ, data: new Uint8Array([0,0,4,0]) });
  await transferOutRaw(req);
  const resp = await transferInRaw(1200);
  if (!resp || resp.length===0) throw new Error('No response to buffer size request');
  const parsed = destructRawPacket(resp);
  if (parsed.type !== v.rawPacketTypes.DUSB_RPKT_BUF_SIZE_ALLOC) throw new Error('Unexpected buffer response type ' + parsed.type);
  const size = bytesToInt(parsed.data);
  bufferSize = size;
  log('Buffer size allocated: ' + size);
  return size;
}

// 2: send virtual packet with chunking & ack per raw chunk
async function sendVirtualPacket(vtype, payloadBytes) {
  const virtual = constructVirtualPacket({ type: vtype, data: payloadBytes || [] });
  const payloadMax = bufferSize - v.rawPacketTypes.HEADER_SIZE;
  const chunks = chunkArray(virtual, [payloadMax]);
  for (let i=0;i<chunks.length;i++){
    const isLast = (i === chunks.length - 1);
    const rawType = isLast ? v.rawPacketTypes.DUSB_RPKT_VIRT_DATA_LAST : v.rawPacketTypes.DUSB_RPKT_VIRT_DATA;
    const rawPacket = constructRawPacket({ type: rawType, data: chunks[i] });
    await transferOutRaw(rawPacket);
    // expect ACK raw type 5
    const ack = await transferInRaw(1200);
    if (!ack || ack.length===0) throw new Error('No ACK received after sending chunk');
    const ackParsed = destructRawPacket(ack);
    if (ackParsed.type !== v.rawPacketTypes.DUSB_RPKT_VIRT_DATA_ACK) {
      throw new Error('Expected ACK type ' + v.rawPacketTypes.DUSB_RPKT_VIRT_DATA_ACK + ' got ' + ackParsed.type);
    }
    log('ACK received for chunk ' + (i+1) + '/' + chunks.length);
  }
}

// 3: read virtual response (wait for raw VIRT_DATA_LAST and return virtual packet)
async function readVirtualResponse(deadlineMs = 3000) {
  const deadline = Date.now() + deadlineMs;
  while (Date.now() < deadline) {
    const raw = await transferInRaw(Math.max(200, deadline - Date.now()));
    if (!raw || raw.length === 0) continue;
    const parsed = destructRawPacket(raw);
    if (parsed.type === v.rawPacketTypes.DUSB_RPKT_VIRT_DATA_LAST) {
      const virt = destructVirtualPacket(parsed.data);
      // send ack
      const ackPkt = constructRawPacket({ type: v.rawPacketTypes.DUSB_RPKT_VIRT_DATA_ACK, data: new Uint8Array([0xE0, 0]) });
      await transferOutRaw(ackPkt);
      return virt;
    } else {
      log('Received raw packet type ' + parsed.type + ' (ignored for now)');
    }
  }
  return null;
}

function parseNamesFromBytes(bytes) {
  const names = [];
  let cur = [];
  for (let i=0;i<bytes.length;i++){
    const b = bytes[i];
    if (b >= 32 && b <= 126) cur.push(String.fromCharCode(b));
    else {
      if (cur.length >= 3) names.push(cur.join('').trim());
      cur = [];
    }
  }
  if (cur.length >= 3) names.push(cur.join('').trim());
  return names;
}

/* high-level flow: buffer -> ping (mode set) -> dir req */
$("connect").addEventListener('click', async () => {
  try {
    log('Calling navigator.usb.requestDevice with PID 0xE008 (VID 0x0451)...');
    const dev = await navigator.usb.requestDevice({ filters: [{ vendorId: 0x0451, productId: 0xE008 }] });
    if (!dev) { log('No device selected'); return; }
    device = dev;
    deviceInfo.textContent = `${device.productName || 'TI Calculator'} — VID:0x${device.vendorId.toString(16)} PID:0x${device.productId.toString(16)}`;
    log('Device chosen: ' + (device.productName || '(unnamed)'));
    try {
      await openAndClaim(device);
      $("dir").disabled = false;
      $("disconnect").disabled = false;
    } catch (e) {
      log('Claim/open error: ' + (e && e.message ? e.message : e));
      $("dir").disabled = false;
      $("disconnect").disabled = false;
    }
  } catch (e) {
    log('Chooser error or cancelled: ' + (e && e.message ? e.message : e));
  }
});

$("disconnect").addEventListener('click', async () => {
  try { if (device && device.opened) { await device.close(); log('Device closed.'); } } catch(e){ log('Close error: ' + (e && e.message ? e.message : e)); }
  device = null; inEp=null; outEp=null;
  deviceInfo.textContent = 'No device';
  $("dir").disabled = true;
  $("disconnect").disabled = true;
});

$("dir").addEventListener('click', async () => {
  try {
    if (!device) { log('No device open'); return; }
    if (!inEp || !outEp) {
      try { await openAndClaim(device); } catch(e){ log('Claim failed: ' + e.message); }
    }

    // request buffer size
    try { await requestBufferSize(); } catch(e) { log('Buffer request failed: ' + (e.message||e)); }

    // send ping (mode set) before directory request
    log('Sending PING (DUSB_VPKT_PING) to negotiate mode (NORMAL)...');
    const modeBytes = new Uint8Array(v.modes.DUSB_MODE_NORMAL);
    await sendVirtualPacket(v.virtualPacketTypes.DUSB_VPKT_PING, modeBytes);

    log('Waiting for MODE_SET (DUSB_VPKT_MODE_SET)...');
    const modeResp = await readVirtualResponse(3000);
    if (!modeResp) {
      log('No MODE_SET reply received. Continuing, but DIR_REQ may be rejected.');
    } else {
      log('Got virtual type 0x' + modeResp.type.toString(16) + ' size=' + modeResp.data.length);
      rawEl.value = hexDump(modeResp.data);
      if (modeResp.type === v.virtualPacketTypes.DUSB_VPKT_MODE_SET) {
        log('Calculator entered requested mode (MODE_SET). Proceeding to directory request.');
      } else if (modeResp.type === v.virtualPacketTypes.DUSB_VPKT_ERROR) {
        log('Mode negotiation returned ERROR. Data: ' + bytesToHexInline(modeResp.data));
      } else {
        log('Mode negotiation returned virtual type 0x' + modeResp.type.toString(16));
      }
    }

    // send directory request
    log('Sending virtual directory request (DUSB_VPKT_DIR_REQ)...');
    await sendVirtualPacket(v.virtualPacketTypes.DUSB_VPKT_DIR_REQ, new Uint8Array([]));

    // poll for response
    log('Polling for virtual response...');
    const virt = await readVirtualResponse(4000);
    if (!virt) {
      log('No virtual response received within timeout.');
      return;
    }

    log('Received virtual packet type 0x' + virt.type.toString(16) + ' size=' + virt.data.length);
    rawEl.value = hexDump(virt.data);

    if (virt.type === v.virtualPacketTypes.DUSB_VPKT_ERROR) {
      log('DUSB ERROR packet received. Error data (hex): ' + bytesToHexInline(virt.data) + ' — parsed: ' + JSON.stringify(Array.from(virt.data)));
      // common error 00 01 is "generic error" — show numeric code
      if (virt.data && virt.data.length >= 2) {
        const code = bytesToInt(virt.data.slice(0,2));
        log('Error code: 0x' + code.toString(16).padStart(4,'0') + ' (' + code + ')');
      }
      log('If this persists, copy the Debug Log including the raw hex and paste here.');
      return;
    }

    // otherwise parse printable names
    const names = parseNamesFromBytes(virt.data);
    if (names.length) {
      log('Parsed names: ' + names.join(', '));
    } else {
      log('No printable names found in that response. Paste the raw hex in chat for further analysis.');
    }

  } catch (e) {
    log('Directory flow error: ' + (e && e.message ? e.message : e));
  }
});
</script>
</body>
</html>
