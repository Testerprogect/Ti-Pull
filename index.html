<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>TI-84 CE DUSB Explorer</title>
  <style>
    :root{
      --bg:#edf4ff;
      --panel:#ffffff;
      --ink:#1d2a3a;
      --muted:#64748b;
      --accent:#2f5fe7;
      --accent-soft:#eaf0ff;
      --border:#dee9ff;
      --logbg:#071b2c;
      --logfg:#dfeeff;
      --danger:#b42525;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      background:linear-gradient(135deg,#eef4ff,#f8fbff);
      color:var(--ink);
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
    }
    .app{
      max-width:1100px;
      margin:20px auto;
      padding:18px;
      background:var(--panel);
      border-radius:16px;
      box-shadow:0 12px 36px rgba(24,46,89,.08);
    }
    header{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      flex-wrap:wrap;
      margin-bottom:12px;
    }
    h1{
      font-size:20px;
      margin:0;
    }
    .controls{
      display:flex;
      flex-wrap:wrap;
      gap:8px;
    }
    button{
      border:none;
      background:var(--accent);
      color:#fff;
      border-radius:10px;
      padding:9px 12px;
      font-weight:700;
      cursor:pointer;
      transition:filter .15s ease;
    }
    button:hover{ filter:brightness(1.03); }
    button.secondary{
      background:#fff;
      color:var(--ink);
      border:1px solid var(--border);
    }
    button.danger{
      background:#fff;
      color:var(--danger);
      border:1px solid rgba(180,37,37,.18);
    }
    button:disabled{
      opacity:.55;
      cursor:not-allowed;
    }
    .status{
      color:var(--muted);
      font-size:13px;
      margin:4px 0 12px 0;
    }
    .options{
      display:flex;
      flex-wrap:wrap;
      gap:10px;
      align-items:center;
      color:var(--muted);
      font-size:13px;
      margin-bottom:10px;
    }
    .options label{
      display:inline-flex;
      align-items:center;
      gap:6px;
    }
    .vars{
      margin-top:10px;
      display:flex;
      flex-direction:column;
      gap:8px;
    }
    .var-row{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      border:1px solid var(--border);
      background:#fff;
      border-radius:10px;
      padding:8px 10px;
    }
    .var-row .name{
      font-weight:600;
      font-family:ui-monospace,monospace;
      overflow-wrap:anywhere;
    }
    .download-group{
      display:flex;
      flex-wrap:wrap;
      gap:6px;
      justify-content:flex-end;
    }
    .download-group button{
      padding:7px 10px;
      font-size:12px;
      border-radius:8px;
    }
    .log{
      margin-top:12px;
      background:var(--logbg);
      color:var(--logfg);
      border-radius:12px;
      padding:12px;
      min-height:280px;
      white-space:pre-wrap;
      font-family:ui-monospace,monospace;
      font-size:12px;
      line-height:1.42;
      overflow:auto;
    }
    textarea.raw{
      width:100%;
      min-height:150px;
      resize:vertical;
      border:1px solid var(--border);
      background:#f9fbff;
      color:#203249;
      font-family:ui-monospace,monospace;
      border-radius:10px;
      padding:10px;
      margin-top:12px;
    }
    @media (max-width: 700px){
      .var-row{
        flex-direction:column;
        align-items:flex-start;
      }
      .download-group{
        justify-content:flex-start;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <h1>TI-84 CE — DUSB Explorer</h1>
      <div class="controls">
        <button id="connect">Connect</button>
        <button id="probe" class="secondary" disabled>Probe Interfaces</button>
        <button id="dir" class="secondary" disabled>Get Directory</button>
        <button id="disconnect" class="danger" disabled>Disconnect</button>
      </div>
    </header>

    <div id="deviceInfo" class="status">No device</div>

    <div class="options">
      <label><input id="autoRelease" type="checkbox" checked /> auto-release failed interfaces</label>
      <label><input id="trySelectAlt" type="checkbox" checked /> try selectAlternateInterface</label>
      <label><input id="alwaysReReqBuf" type="checkbox" /> always re-request buffer</label>
    </div>

    <div id="vars" class="vars"></div>

    <h3 style="margin:12px 0 0 0;">Debug Log</h3>
    <div id="log" class="log">No activity yet. Use: Connect → Probe Interfaces → Get Directory → Download.</div>

    <h3 style="margin:12px 0 0 0;">Latest raw / virtual data</h3>
    <textarea id="raw" class="raw" readonly placeholder="Raw data will appear here"></textarea>
  </div>

  <script>
    "use strict";

    const v = {
      rawPacketTypes: {
        DUSB_RPKT_BUF_SIZE_REQ: 1,
        DUSB_RPKT_BUF_SIZE_ALLOC: 2,
        DUSB_RPKT_VIRT_DATA: 3,
        DUSB_RPKT_VIRT_DATA_LAST: 4,
        DUSB_RPKT_VIRT_DATA_ACK: 5,
        HEADER_SIZE: 5
      },
      virtualPacketTypes: {
        DUSB_VPKT_PING: 0x0001,
        DUSB_VPKT_DIR_REQ: 0x0009,
        DUSB_VPKT_VAR_HDR: 0x000A,
        DUSB_VPKT_RTS: 0x000B,
        DUSB_VPKT_VAR_REQ: 0x000C,
        DUSB_VPKT_VAR_CNTS: 0x000D,
        DUSB_VPKT_MODE_SET: 0x0012,
        DUSB_VPKT_DELAY_ACK: 0xBB00,
        DUSB_VPKT_EOT: 0xDD00,
        DUSB_VPKT_ERROR: 0xEE00
      },
      modes: {
        NORMAL: [0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x07,0xD0],
        BASIC:  [0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x07,0xD0],
        STARTUP:[0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x07,0xD0]
      },
      transferModes: {
        SILENT: 0x01,
        NON_SILENT: 0x02
      }
    };

    // The mode packet bytes are typically interpreted as [0, modeID, 0, 1, ...]
    // We keep the exact shapes used by the real logs for compatibility.
    v.modes.NORMAL = new Uint8Array([0x00,0x00,0x00,0x00,0x0A,0x00,0x01,0x00,0x03,0x00,0x01,0x00,0x00,0x00,0x00,0x07,0xD0]);
    v.modes.BASIC  = new Uint8Array([0x00,0x00,0x00,0x00,0x0A,0x00,0x01,0x00,0x02,0x00,0x01,0x00,0x00,0x00,0x00,0x07,0xD0]);
    v.modes.STARTUP = new Uint8Array([0x00,0x00,0x00,0x00,0x0A,0x00,0x01,0x00,0x01,0x00,0x01,0x00,0x00,0x00,0x00,0x07,0xD0]);

    function intToBytes(num, len) {
      const out = new Uint8Array(len);
      for (let i = 0; i < len; i++) {
        out[len - 1 - i] = (num >>> (8 * i)) & 0xFF;
      }
      return out;
    }

    function bytesToInt(bytes) {
      let out = 0;
      for (let i = 0; i < bytes.length; i++) {
        out = (out << 8) | (bytes[i] & 0xFF);
      }
      return out;
    }

    function constructRawPacket(type, data) {
      const payload = data || new Uint8Array(0);
      const out = new Uint8Array(5 + payload.length);
      out.set(intToBytes(payload.length, 4), 0);
      out[4] = type & 0xFF;
      out.set(payload, 5);
      return out;
    }

    function destructRawPacket(buf) {
      if (!buf || buf.length < 5) {
        return { size: 0, type: 0, data: new Uint8Array(0) };
      }
      const size = bytesToInt(buf.slice(0, 4));
      const type = buf[4];
      const data = buf.slice(5, 5 + size);
      return { size, type, data };
    }

    function constructVirtualPacket(type, data) {
      const payload = data || new Uint8Array(0);
      const out = new Uint8Array(6 + payload.length);
      out.set(intToBytes(payload.length, 4), 0);
      out.set(intToBytes(type, 2), 4);
      out.set(payload, 6);
      return out;
    }

    function destructVirtualPacket(buf) {
      if (!buf || buf.length < 6) {
        return { size: 0, type: 0, data: new Uint8Array(0) };
      }
      const size = bytesToInt(buf.slice(0, 4));
      const type = bytesToInt(buf.slice(4, 6));
      const data = buf.slice(6, 6 + size);
      return { size, type, data };
    }

    function bytesToHexInline(bytes) {
      if (!bytes) return "";
      return Array.from(bytes).map(b => b.toString(16).padStart(2, "0").toUpperCase()).join(" ");
    }

    function hexDump(bytes) {
      if (!bytes || bytes.length === 0) return "(empty)";
      let out = "";
      for (let i = 0; i < bytes.length; i += 16) {
        const chunk = bytes.slice(i, i + 16);
        const hex = Array.from(chunk).map(b => b.toString(16).padStart(2, "0").toUpperCase()).join(" ");
        const ascii = Array.from(chunk).map(b => (b >= 32 && b <= 126 ? String.fromCharCode(b) : ".")).join("");
        out += i.toString(16).padStart(8, "0") + "  " + hex.padEnd(47, " ") + "  " + ascii + "\\n";
      }
      return out;
    }

    function asciiToBytes(str, length) {
      const u8 = new TextEncoder().encode(str);
      const out = new Uint8Array(length || u8.length);
      out.set(u8.slice(0, length || u8.length));
      return out;
    }

    function bytesToAscii(bytes) {
      if (!bytes || bytes.length === 0) return "";
      const end = bytes.indexOf(0);
      const slice = end >= 0 ? bytes.slice(0, end) : bytes;
      return new TextDecoder("utf-8").decode(slice);
    }

    function decodeVarHeaderName(hdr) {
      const b = Array.from(hdr || []);
      if (!b.length) return "(empty)";

      // Common pattern: [00][len][name...]
      if (hdr.length >= 2 && hdr[0] === 0x00 && hdr[1] > 0 && hdr[1] <= 32) {
        const len = hdr[1];
        const txt = bytesToAscii(hdr.slice(2, 2 + len));
        if (txt && txt.length > 0) return txt;
      }

      // If the header starts with a printable string then use it.
      let best = "";
      let cur = "";
      for (let i = 0; i < hdr.length; i++) {
        const x = hdr[i];
        if (x >= 32 && x <= 126) {
          cur += String.fromCharCode(x);
        } else {
          if (cur.length >= 3 && cur.length > best.length) best = cur;
          cur = "";
        }
      }
      if (cur.length >= 3 && cur.length > best.length) best = cur;
      if (best) return best;

      // Last resort: use the first printable bytes or raw bytes.
      for (let i = 0; i < hdr.length; i++) {
        if (hdr[i] >= 32 && hdr[i] <= 126) {
          let out = "";
          for (let j = i; j < hdr.length && hdr[j] >= 32 && hdr[j] <= 126; j++) {
            out += String.fromCharCode(hdr[j]);
          }
          if (out.length > 0) return out;
        }
      }
      return "(unknown)";
    }

    function chunkBySize(arr, chunkSize) {
      const out = [];
      for (let i = 0; i < arr.length; i += chunkSize) {
        out.push(arr.slice(i, i + chunkSize));
      }
      return out;
    }

    const $ = (id) => document.getElementById(id);

    const logEl = $("log");
    const rawEl = $("raw");
    const varsEl = $("vars");
    const deviceInfo = $("deviceInfo");

    function log(...parts) {
      const ts = new Date().toLocaleTimeString();
      const msg = parts.map(p => {
        if (typeof p === "string") return p;
        if (p instanceof Uint8Array) return bytesToHexInline(p);
        if (p instanceof ArrayBuffer) return bytesToHexInline(new Uint8Array(p));
        try { return JSON.stringify(p); } catch { return String(p); }
      }).join(" ");
      logEl.textContent += `[${ts}] ${msg}\\n`;
      logEl.scrollTop = logEl.scrollHeight;
      console.log(...parts);
    }

    let device = null;
    let inEp = null;
    let outEp = null;
    let endpointPacketSize = 64;
    let bufferSize = null;
    let discoveredVars = [];

    function saveBlob(filename, bytes, mimeType) {
      const blob = new Blob([bytes], { type: mimeType });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
    }

    function isMostlyPrintableAscii(data) {
      if (!data || data.length === 0) return false;
      let good = 0;
      for (let i = 0; i < data.length; i++) {
        const b = data[i];
        if ((b >= 32 && b <= 126) || b === 9 || b === 10 || b === 13) good++;
      }
      return (good / data.length) > 0.75;
    }

    function textFromVarData(data) {
      if (!data || data.length === 0) return "";
      if (isMostlyPrintableAscii(data)) {
        return new TextDecoder("ascii").decode(data);
      }
      let out = "TI-84 variable dump (hex):\\n\\n";
      out += Array.from(data).map(b => b.toString(16).padStart(2, "0").toUpperCase()).join(" ");
      return out;
    }

    function create8xpFromProgramData(name, data) {
      // Best-effort 8XP packaging for a raw TI-Basic program body.
      // This is not guaranteed to be perfect for all TI tools, but it creates a valid-ish 8XP file.
      const nameBytes = new TextEncoder().encode(name);
      const headerLen = 9 + nameBytes.length + 1;
      const header = new Uint8Array(headerLen);

      let p = 0;

      // 8XP magic / basic header
      const sig = [0x89, 0x38, 0x50, 0x58, 0x41, 0x00, 0x00, 0x00, 0x00];
      sig.forEach(v => header[p++] = v);

      // program type = 0
      header[p++] = 0x00;
      header[p++] = 0x00;

      // name length + name
      header[p++] = nameBytes.length;
      header.set(nameBytes, p);
      p += nameBytes.length;
      header[p++] = 0x00;

      const body = new Uint8Array(data || []);
      const lenBytes = intToBytes(body.length, 4);

      const out = new Uint8Array(header.length + lenBytes.length + body.length);
      out.set(header, 0);
      out.set(lenBytes, header.length);
      out.set(body, header.length + lenBytes.length);

      return out;
    }

    async function transferOutRaw(bytes) {
      if (!device || !outEp) throw new Error("No USB OUT endpoint");
      await device.transferOut(outEp.endpointNumber, bytes);
      log("transferOut ->", bytesToHexInline(bytes));
    }

    async function transferInRaw(timeoutMs = 1500) {
      if (!device || !inEp) {
        return new Uint8Array();
      }
      try {
        const res = await Promise.race([
          device.transferIn(inEp.endpointNumber, endpointPacketSize || 64),
          new Promise((_, reject) => setTimeout(() => reject(new Error("transferIn timeout")), timeoutMs))
        ]);
        if (!res || !res.data) return new Uint8Array();
        const data = new Uint8Array(res.data.buffer, res.data.byteOffset, res.data.byteLength);
        log("transferIn <-", bytesToHexInline(data));
        return data;
      } catch (e) {
        log("transferIn error:", e && e.message ? e.message : e);
        return new Uint8Array();
      }
    }

    async function sendVirtualPacket(type, payload) {
      const data = payload || new Uint8Array(0);
      const maxPayload = Math.max(1, (bufferSize || 512) - 5);
      const chunks = chunkBySize(data, maxPayload);

      for (let i = 0; i < chunks.length; i++) {
        const chunk = chunks[i];
        const last = (i === chunks.length - 1);
        const rawType = last ? v.rawPacketTypes.DUSB_RPKT_VIRT_DATA_LAST : v.rawPacketTypes.DUSB_RPKT_VIRT_DATA;
        const rawPacket = constructRawPacket(rawType, constructVirtualPacket(type, chunk));
        await transferOutRaw(rawPacket);

        const sendDone = await waitForChunkAck();
        if (!sendDone) {
          throw new Error("No ACK after virtual packet chunk");
        }
      }
    }

    async function waitForChunkAck(timeoutMs = 3000) {
      const deadline = Date.now() + timeoutMs;
      while (Date.now() < deadline) {
        const raw = await transferInRaw(Math.max(100, deadline - Date.now()));
        if (!raw || raw.length === 0) continue;
        const parsed = destructRawPacket(raw);
        if (parsed.type === v.rawPacketTypes.DUSB_RPKT_VIRT_DATA_ACK) {
          log("Chunk ACK raw received");
          return true;
        }
        if (parsed.type === v.rawPacketTypes.DUSB_RPKT_VIRT_DATA || parsed.type === v.rawPacketTypes.DUSB_RPKT_VIRT_DATA_LAST) {
          const virt = destructVirtualPacket(parsed.data);
          log("Virtual packet type 0x" + virt.type.toString(16) + " size=" + virt.data.length);
          if (virt.type === v.virtualPacketTypes.DUSB_VPKT_DELAY_ACK) {
            const value = bytesToInt(virt.data);
            const waitMs = Math.max(100, value);
            log("DELAY_ACK — wait", waitMs, "ms");
            await new Promise(r => setTimeout(r, waitMs));
          }
        }
      }
      return false;
    }

    async function readVirtualResponse(timeoutMs = 8000) {
      const deadline = Date.now() + timeoutMs;
      while (Date.now() < deadline) {
        const raw = await transferInRaw(Math.max(200, deadline - Date.now()));
        if (!raw || raw.length === 0) continue;

        const parsed = destructRawPacket(raw);
        if (parsed.type !== v.rawPacketTypes.DUSB_RPKT_VIRT_DATA &&
            parsed.type !== v.rawPacketTypes.DUSB_RPKT_VIRT_DATA_LAST) {
          log("Ignoring raw type", parsed.type);
          continue;
        }

        const virt = destructVirtualPacket(parsed.data);
        log("Virtual packet type 0x" + virt.type.toString(16) + " size=" + virt.data.length);

        if (virt.type === v.virtualPacketTypes.DUSB_VPKT_DELAY_ACK) {
          const delay = bytesToInt(virt.data);
          const waitMs = Math.max(100, delay);
          log("DELAY_ACK — wait", waitMs, "ms");
          await new Promise(r => setTimeout(r, waitMs));
          continue;
        }

        // ACK the packet
        const ack = constructRawPacket(v.rawPacketTypes.DUSB_RPKT_VIRT_DATA_ACK, new Uint8Array([0xE0, 0x00]));
        await transferOutRaw(ack);

        return virt;
      }
      return null;
    }

    async function requestBufferSizeOnce() {
      log("Requesting buffer size (DUSB_RPKT_BUF_SIZE_REQ)...");
      const req = constructRawPacket(v.rawPacketTypes.DUSB_RPKT_BUF_SIZE_REQ, new Uint8Array([0x00,0x00,0x00,0x04,0x00]));
      await transferOutRaw(req);

      const resp = await transferInRaw(1600);
      if (!resp || resp.length === 0) {
        throw new Error("No response to buffer size request");
      }
      const parsed = destructRawPacket(resp);
      if (parsed.type !== v.rawPacketTypes.DUSB_RPKT_BUF_SIZE_ALLOC) {
        throw new Error("Unexpected buffer response type " + parsed.type);
      }
      bufferSize = bytesToInt(parsed.data);
      log("Buffer size allocated:", bufferSize);
      return bufferSize;
    }

    async function probeInterfaces() {
      if (!device) {
        log("No device");
        return null;
      }

      log("Opening device and probing interfaces...");
      try {
        if (!device.opened) {
          await device.open();
          log("Device opened.");
        }
      } catch (e) {
        log("device.open failed:", e && e.message ? e.message : e);
      }

      if (!device.configuration) {
        try {
          await device.selectConfiguration(1);
          log("Selected configuration 1");
        } catch (e) {
          log("selectConfiguration failed:", e && e.message ? e.message : e);
        }
      }

      const autoRelease = $("autoRelease").checked;
      const trySelectAlt = $("trySelectAlt").checked;

      const configs = device.configurations || [device.configuration].filter(Boolean);
      for (const cfg of configs) {
        log("Inspecting configuration", cfg.configurationValue || 1);
        const interfaces = cfg.interfaces || [];
        for (const iface of interfaces) {
          const alts = iface.alternates || [];
          for (const alt of alts) {
            const inEpCandidate = (alt.endpoints || []).find(e => e.direction === "in");
            const outEpCandidate = (alt.endpoints || []).find(e => e.direction === "out");
            if (!inEpCandidate || !outEpCandidate) continue;

            log("Trying iface", iface.interfaceNumber, "alt", alt.alternateSetting, "IN=", inEpCandidate.endpointNumber, "OUT=", outEpCandidate.endpointNumber, "pktSize=", inEpCandidate.packetSize || 64);

            try {
              if (trySelectAlt && typeof device.selectAlternateInterface === "function") {
                try {
                  await device.selectAlternateInterface(iface.interfaceNumber, alt.alternateSetting);
                  log("selectAlternateInterface succeeded");
                } catch (e) {
                  log("selectAlternateInterface failed:", e && e.message ? e.message : e);
                }
              }

              try {
                await device.claimInterface(iface.interfaceNumber);
                log("Claimed interface", iface.interfaceNumber);
              } catch (e) {
                log("claimInterface failed:", e && e.message ? e.message : e);
                continue;
              }

              inEp = inEpCandidate;
              outEp = outEpCandidate;
              endpointPacketSize = inEp.packetSize || 64;

              try {
                if (!bufferSize || $("alwaysReReqBuf").checked) {
                  await requestBufferSizeOnce();
                } else {
                  log("Reusing bufferSize=", bufferSize);
                }
                log("Buffer ok on iface", iface.interfaceNumber);
                $("dir").disabled = false;
                return { iface: iface.interfaceNumber, alt: alt.alternateSetting };
              } catch (e) {
                log("Buffer request failed on iface", iface.interfaceNumber, ":", e && e.message ? e.message : e);
                if (autoRelease) {
                  try { await device.releaseInterface(iface.interfaceNumber); } catch (_) {}
                }
                continue;
              }
            } catch (err) {
              log("Error probing iface/alt:", err && err.message ? err.message : err);
            }
          }
        }
      }

      log("Probe finished: no working alternate found.");
      return null;
    }

    function renderVars() {
      varsEl.innerHTML = "";
      for (const item of discoveredVars) {
        const row = document.createElement("div");
        row.className = "var-row";

        const name = document.createElement("div");
        name.className = "name";
        name.textContent = item.name;

        const group = document.createElement("div");
        group.className = "download-group";

        const bt8 = document.createElement("button");
        bt8.textContent = ".8xp";
        bt8.onclick = () => downloadVariable(item.name, item.hdr, "8xp");

        const btTxt = document.createElement("button");
        btTxt.textContent = ".txt";
        btTxt.onclick = () => downloadVariable(item.name, item.hdr, "txt");

        const btRaw = document.createElement("button");
        btRaw.textContent = "raw";
        btRaw.onclick = () => downloadVariable(item.name, item.hdr, "raw");

        group.appendChild(bt8);
        group.appendChild(btTxt);
        group.appendChild(btRaw);
        row.appendChild(name);
        row.appendChild(group);
        varsEl.appendChild(row);
      }
    }

    async function doGetDirectoryAndList() {
      if (!device || !inEp || !outEp) {
        log("Device not ready");
        return;
      }

      discoveredVars = [];
      varsEl.innerHTML = "";

      try {
        if (!bufferSize || $("alwaysReReqBuf").checked) {
          await requestBufferSizeOnce();
        }
      } catch (e) {
        log("buffer request failed:", e && e.message ? e.message : e);
      }

      log("Sending PING (mode NORMAL) ...");
      await sendVirtualPacket(v.virtualPacketTypes.DUSB_VPKT_PING, v.modes.NORMAL);
      let modeResp = await readVirtualResponse(4000);
      if (!modeResp) {
        log("No mode response after PING");
      } else {
        log("Mode virt type 0x" + modeResp.type.toString(16));
      }

      log("Sending DIR_REQ ...");
      await sendVirtualPacket(v.virtualPacketTypes.DUSB_VPKT_DIR_REQ, new Uint8Array(0));

      const deadline = Date.now() + 9000;
      while (Date.now() < deadline) {
        const virt = await readVirtualResponse(Math.max(200, deadline - Date.now()));
        if (!virt) break;

        rawEl.value = hexDump(virt.data);

        if (virt.type === v.virtualPacketTypes.DUSB_VPKT_VAR_HDR) {
          const hdr = virt.data;
          const name = decodeVarHeaderName(hdr);
          log("Found variable:", name, "hdr=", bytesToHexInline(hdr));
          discoveredVars.push({ name, hdr: new Uint8Array(hdr) });
          renderVars();
        } else if (virt.type === v.virtualPacketTypes.DUSB_VPKT_EOT) {
          log("Directory EOT");
          break;
        } else if (virt.type === v.virtualPacketTypes.DUSB_VPKT_ERROR) {
          log("Directory ERROR:", bytesToHexInline(virt.data));
          break;
        }
      }

      if (discoveredVars.length === 0) {
        log("No variables discovered");
      }
    }

    function buildVarReqFallbackCandidates(hdrBytes) {
      const candidates = [];
      const seen = new Set();

      function addCandidate(label, data) {
        const key = bytesToHexInline(data);
        if (!seen.has(key)) {
          seen.add(key);
          candidates.push({ label, data: new Uint8Array(data) });
        }
      }

      addCandidate("hdr_exact", hdrBytes);

      const printableStart = Array.from(hdrBytes).findIndex(b => b >= 32 && b <= 126);
      if (printableStart >= 0) {
        addCandidate("hdr_from_printable", hdrBytes.slice(printableStart));
      }

      let bestRunStart = -1;
      let bestRunLen = 0;
      let curStart = -1;
      let curLen = 0;

      for (let i = 0; i < hdrBytes.length; i++) {
        const b = hdrBytes[i];
        if (b >= 32 && b <= 126) {
          if (curStart === -1) curStart = i;
          curLen++;
        } else {
          if (curLen > bestRunLen) {
            bestRunLen = curLen;
            bestRunStart = curStart;
          }
          curStart = -1;
          curLen = 0;
        }
      }
      if (curLen > bestRunLen) {
        bestRunLen = curLen;
        bestRunStart = curStart;
      }

      if (bestRunStart >= 0 && bestRunLen > 0) {
        const run = hdrBytes.slice(bestRunStart, bestRunStart + bestRunLen);
        const lenField = new Uint8Array([bestRunLen & 0xFF, (bestRunLen >> 8) & 0xFF]);
        const withLen = new Uint8Array(lenField.length + run.length);
        withLen.set(lenField, 0);
        withLen.set(run, lenField.length);
        addCandidate("name_len_name", withLen);
        addCandidate("name_only", run);

        const t05 = new Uint8Array([0x05, bestRunLen & 0xFF]);
        const t05n = new Uint8Array(t05.length + run.length);
        t05n.set(t05, 0);
        t05n.set(run, t05.length);
        addCandidate("type05_nameLen_name", t05n);
      }

      const typeList = [0x05, 0x15, 0x01];
      for (const type of typeList) {
        for (let offset = 0; offset < hdrBytes.length; offset++) {
          if (hdrBytes[offset] >= 32 && hdrBytes[offset] <= 126) {
            const run = hdrBytes.slice(offset);
            const payload = new Uint8Array(4 + run.length);
            payload[0] = 0x0B;
            payload[1] = 0x00;
            payload[2] = type & 0xFF;
            payload[3] = 0x00;
            payload.set(run, 4);
            addCandidate(`vt${type}_name`, payload);
          }
        }
      }

      return candidates;
    }

    function buildReadRTSRequest(name, typeCode = 0x00) {
      // This follows the same structure as the read requests used in the logs:
      // [nameLen:2] + name + 0 + [size:4 = 0] + [mode] + [attribute block]
      // The exact attribute block is variable across device builds, so we try a few type values.
      const n = asciiToBytes(name, name.length);
      const block = new Uint8Array(12);
      block[0] = 0x00; // count = 1
      block[1] = 0x01;
      block[2] = 0x00;
      block[3] = 0x02; // attribute type
      block[4] = 0x00;
      block[5] = 0x00;
      block[6] = 0x00;
      block[7] = 0x04; // size=4
      const value = intToBytes(0xF0000000 + (typeCode & 0xFF), 4);
      block.set(value, 8);

      const out = new Uint8Array(2 + n.length + 1 + 4 + 1 + block.length);
      let p = 0;
      out.set(intToBytes(n.length, 2), p); p += 2;
      out.set(n, p); p += n.length;
      out[p++] = 0x00;
      out.set(intToBytes(0, 4), p); p += 4;
      out[p++] = v.transferModes.SILENT;
      out.set(block, p);
      return out;
    }

    async function gatherVarContentsFromVirtualStream(timeoutMs = 12000) {
      const chunks = [];
      const end = Date.now() + timeoutMs;

      while (Date.now() < end) {
        const virt = await readVirtualResponse(Math.max(200, end - Date.now()));
        if (!virt) break;

        rawEl.value = hexDump(virt.data);

        if (virt.type === v.virtualPacketTypes.DUSB_VPKT_VAR_CNTS) {
          chunks.push(new Uint8Array(virt.data));
          continue;
        }

        if (virt.type === v.virtualPacketTypes.DUSB_VPKT_EOT) {
          log("EOT received");
          break;
        }

        if (virt.type === v.virtualPacketTypes.DUSB_VPKT_ERROR) {
          log("ERROR from device while reading:", bytesToHexInline(virt.data));
          break;
        }
      }

      if (chunks.length === 0) return null;

      let total = 0;
      for (const c of chunks) total += c.length;
      const out = new Uint8Array(total);
      let p = 0;
      for (const c of chunks) {
        out.set(c, p);
        p += c.length;
      }
      return out;
    }

    async function readVariablePayload(name, hdr) {
      const modes = [
        { label: "NORMAL", bytes: v.modes.NORMAL },
        { label: "BASIC", bytes: v.modes.BASIC },
        { label: "STARTUP", bytes: v.modes.STARTUP }
      ];

      const rtsCandidates = [
        { label: "program", body: buildReadRTSRequest(name, 0x00) },
        { label: "program_alt", body: buildReadRTSRequest(name, 0x05) },
        { label: "appvar", body: buildReadRTSRequest(name, 0x15) }
      ];

      for (const mode of modes) {
        log("Trying mode", mode.label, "for RTS read");
        try {
          await sendVirtualPacket(v.virtualPacketTypes.DUSB_VPKT_PING, mode.bytes);
          const resp = await readVirtualResponse(3000);
          if (resp) {
            log("Mode negotiation returned virtual type 0x" + resp.type.toString(16));
          }

          for (const rts of rtsCandidates) {
            log("Trying RTS candidate:", rts.label, bytesToHexInline(rts.body));
            try {
              await sendVirtualPacket(v.virtualPacketTypes.DUSB_VPKT_RTS, rts.body);
              const content = await gatherVarContentsFromVirtualStream(12000);
              if (content && content.length > 0) {
                log("RTS data succeeded for", name, "in mode", mode.label, "candidate", rts.label);
                return content;
              }
            } catch (e) {
              log("RTS candidate failed:", rts.label, e && e.message ? e.message : e);
            }
          }
        } catch (e) {
          log("RTS mode failed:", mode.label, e && e.message ? e.message : e);
        }
      }

      const fallbackVars = buildVarReqFallbackCandidates(hdr);
      log("Built", fallbackVars.length, "VAR_REQ fallback candidates:", fallbackVars.map(x => x.label).join(", "));

      for (const mode of modes) {
        log("Trying mode", mode.label, "for VAR_REQ fallback");
        try {
          await sendVirtualPacket(v.virtualPacketTypes.DUSB_VPKT_PING, mode.bytes);
          const resp = await readVirtualResponse(3000);
          if (resp) {
            log("Mode negotiation returned virtual type 0x" + resp.type.toString(16));
          }

          for (const cand of fallbackVars) {
            log("Attempting VAR_REQ candidate", cand.label, bytesToHexInline(cand.data));
            try {
              await sendVirtualPacket(v.virtualPacketTypes.DUSB_VPKT_VAR_REQ, cand.data);
              const content = await gatherVarContentsFromVirtualStream(12000);
              if (content && content.length > 0) {
                log("VAR_REQ data succeeded for", name, "in mode", mode.label, "candidate", cand.label);
                return content;
              }
            } catch (e) {
              log("VAR_REQ candidate failed:", cand.label, e && e.message ? e.message : e);
            }
          }
        } catch (e) {
          log("VAR_REQ mode failed:", mode.label, e && e.message ? e.message : e);
        }
      }

      log("All RTS and VAR_REQ attempts failed for", name);
      return null;
    }

    async function downloadVariable(name, hdr, format) {
      log("Download request for:", name, "as", format);

      const data = await readVariablePayload(name, hdr);
      if (!data || data.length === 0) {
        log("No usable data returned for", name);
        return;
      }

      if (format === "8xp") {
        const buf = create8xpFromProgramData(name, data);
        saveBlob(name + ".8xp", buf, "application/octet-stream");
        log("Saved:", name + ".8xp");
        return;
      }

      if (format === "txt") {
        const txt = textFromVarData(data);
        saveBlob(name + ".txt", new TextEncoder().encode(txt), "text/plain;charset=utf-8");
        log("Saved:", name + ".txt");
        return;
      }

      // raw
      saveBlob(name + ".bin", data, "application/octet-stream");
      log("Saved:", name + ".bin");
    }

    document.getElementById("connect").addEventListener("click", async () => {
      try {
        log("navigator.usb.requestDevice (PID 0xE008) ...");
        const deviceCandidate = await navigator.usb.requestDevice({
          filters: [{ vendorId: 0x0451, productId: 0xE008 }]
        });
        if (!deviceCandidate) {
          log("No device selected");
          return;
        }

        device = deviceCandidate;
        const product = device.productName || "TI-84 Plus CE";
        deviceInfo.textContent = `${product} — VID:0x${device.vendorId.toString(16).toUpperCase()} PID:0x${device.productId.toString(16).toUpperCase()}`;
        log("Device chosen:", product);
        $("probe").disabled = false;
        $("disconnect").disabled = false;
      } catch (e) {
        log("Chooser error/cancel:", e && e.message ? e.message : e);
      }
    });

    document.getElementById("probe").addEventListener("click", async () => {
      if (!device) {
        log("No device");
        return;
      }
      const result = await probeInterfaces();
      if (result) {
        log("Probe success:", result);
      } else {
        log("Probe found no working alternate");
      }
    });

    document.getElementById("dir").addEventListener("click", async () => {
      await doGetDirectoryAndList();
    });

    document.getElementById("disconnect").addEventListener("click", async () => {
      if (!device) return;
      try {
        if (device.opened) await device.close();
      } catch (e) {
        log("Close error:", e && e.message ? e.message : e);
      }
      device = null;
      inEp = null;
      outEp = null;
      discoveredVars = [];
      varsEl.innerHTML = "";
      deviceInfo.textContent = "No device";
      $("probe").disabled = true;
      $("dir").disabled = true;
      $("disconnect").disabled = true;
      log("Disconnected and cleared state.");
    });

    log("Page loaded. Use: Connect → Probe Interfaces → Get Directory → Download.");
  </script>
</body>
