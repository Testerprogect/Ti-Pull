<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>TI-84 CE — Interface Probe + DUSB Directory (fixed open)</title>
<style>
  body{font-family:system-ui,Segoe UI,Roboto,Arial;margin:0;background:linear-gradient(135deg,#eef4ff,#f7fbff);color:#0b2436}
  .app{max-width:1100px;margin:18px auto;background:#fff;border-radius:12px;padding:18px;box-shadow:0 12px 40px rgba(20,40,80,.08)}
  header{display:flex;justify-content:space-between;align-items:center}
  h1{margin:0;font-size:18px}
  .controls{display:flex;gap:8px}
  button{padding:8px 12px;border-radius:8px;border:0;background:#3f61d7;color:#fff;font-weight:700;cursor:pointer}
  button.ghost{background:#fff;border:1px solid #e6edf9;color:#2b3a57}
  .log{margin-top:12px;background:#071426;color:#dbeeff;padding:12px;border-radius:8px;min-height:320px;white-space:pre-wrap;font-family:ui-monospace,monospace}
  textarea.raw{width:100%;height:140px;margin-top:12px;font-family:ui-monospace,monospace}
  .note{color:#516a80;font-size:13px;margin-top:8px}
  .panel{margin-top:12px;display:flex;gap:8px;align-items:center}
</style>
</head>
<body>
  <div class="app">
    <header>
      <div>
        <h1>TI-84 CE — Interface Probe + DUSB Directory (fixed)</h1>
        <div class="note">Probes all interfaces & alternates. Ensures device.open() / selectConfiguration before claiming.</div>
      </div>
      <div class="controls">
        <button id="connect">Connect</button>
        <button id="probe" class="ghost" disabled>Probe Interfaces</button>
        <button id="dir" class="ghost" disabled>Get Directory</button>
        <button id="reset" class="ghost" disabled>Reset Device</button>
        <button id="disconnect" class="ghost" disabled>Disconnect</button>
      </div>
    </header>

    <div id="deviceInfo" style="margin-top:12px;color:#556b80">No device</div>

    <div class="panel">
      <label style="font-size:13px;color:#334d66">Probe options:</label>
      <label style="font-size:13px;color:#334d66"><input id="autoClaim" type="checkbox" checked/> auto-release failed interfaces</label>
      <label style="font-size:13px;color:#334d66"><input id="trySelectAlt" type="checkbox" checked/> try selectAlternateInterface (if available)</label>
    </div>

    <h3 style="margin-top:12px">Debug Log</h3>
    <div id="log" class="log">No activity yet.</div>

    <h3 style="margin-top:12px">Latest raw / virtual data</h3>
    <textarea id="raw" class="raw" readonly placeholder="Raw hex dump will appear here"></textarea>
  </div>

<script>
"use strict";

/* DUSB constants */
const v = {
  rawPacketTypes: {
    DUSB_RPKT_BUF_SIZE_REQ:    1,
    DUSB_RPKT_BUF_SIZE_ALLOC:  2,
    DUSB_RPKT_VIRT_DATA:       3,
    DUSB_RPKT_VIRT_DATA_LAST:  4,
    DUSB_RPKT_VIRT_DATA_ACK:   5,
    HEADER_SIZE:               4 + 1
  },
  virtualPacketTypes: {
    DUSB_VPKT_PING:            0x0001,
    DUSB_VPKT_DIR_REQ:         0x0009,
    DUSB_VPKT_MODE_SET:        0x0012,
    DUSB_VPKT_DELAY_ACK:       0xBB00,
    DUSB_VPKT_ERROR:           0xEE00,
    HEADER_SIZE:               4 + 2
  },
  modes: {
    DUSB_MODE_NORMAL:          [ 0,3, 0,1, 0,0, 0,0, 0x07,0xd0 ]
  }
};

/* byte helpers */
function intToBytes(num, length) {
  const bytes = [];
  while (length > 0) {
    length--;
    bytes.push((num / Math.pow(256, length)) & 0xFF);
  }
  return bytes;
}
function bytesToInt(bytes) {
  let length = bytes.length;
  let result = 0;
  let i = 0;
  while (length > 0) {
    length--;
    result += (bytes[i++] & 0xFF) * Math.pow(256, length);
  }
  return result;
}
function constructPacket(packet, typeSize) {
  const size = packet.data && packet.data.length || 0;
  const header = intToBytes(size, 4);
  header.splice(4, 0, ...intToBytes(packet.type, typeSize));
  const result = new Uint8Array(header.length + size);
  result.set(header);
  result.set(packet.data || [], header.length);
  return result;
}
function constructRawPacket(packet) { return constructPacket(packet, 1); }
function constructVirtualPacket(packet) { return constructPacket(packet, 2); }
function destructRawPacket(packet) {
  return { size: bytesToInt(packet.slice(0,4)), type: packet[4], data: packet.slice(5) };
}
function destructVirtualPacket(packet) {
  return { size: bytesToInt(packet.slice(0,4)), type: bytesToInt(packet.slice(4,6)), data: packet.slice(6) };
}
function chunkArray(array, sizes) {
  const result = [];
  let i, j = 0;
  for (i = 0; i < sizes.length; i++) {
    result.push(array.slice(j, j + sizes[i]));
    j += sizes[i];
    if (j >= array.length) return result;
  }
  i--;
  while (j < array.length) {
    result.push(array.slice(j, j + sizes[i]));
    j += sizes[i];
  }
  return result;
}

/* UI & logging */
const $ = id => document.getElementById(id);
const logEl = $("log"), rawEl = $("raw"), deviceInfo = $("deviceInfo");
function log(...parts) {
  const t = new Date().toLocaleTimeString();
  const line = `[${t}] ${parts.map(p => typeof p === 'string' ? p : JSON.stringify(p)).join(' ')}`;
  logEl.textContent += line + "\n";
  logEl.scrollTop = logEl.scrollHeight;
  console.log(...parts);
}
function hexDump(bytes) {
  if (!bytes || bytes.length===0) return "(empty)";
  let out="";
  for (let i=0;i<bytes.length;i+=16){
    const chunk = bytes.slice(i,i+16);
    const hex = Array.from(chunk).map(b=>b.toString(16).padStart(2,'0').toUpperCase()).join(' ');
    const ascii = Array.from(chunk).map(b=> (b>=32 && b<=126) ? String.fromCharCode(b) : '.').join('');
    out += i.toString(16).padStart(8,'0') + '  ' + hex.padEnd(47,' ') + '  ' + ascii + '\n';
  }
  return out;
}
function bytesToHexInline(bytes){ return Array.from(bytes||[]).map(b=>b.toString(16).padStart(2,'0').toUpperCase()).join(' '); }

/* device state */
let device = null;
let currentIface = null;
let currentAlt = null;
let inEp = null;
let outEp = null;
let endpointPacketSize = 512;
let bufferSize = 64;

/* low-level transfer wrappers */
async function transferOutRaw(buffer) {
  await device.transferOut(outEp.endpointNumber, buffer);
  log('transferOut ->', bytesToHexInline(buffer));
}
async function transferInRaw(timeoutMs = 1200) {
  try {
    const length = endpointPacketSize || 4096;
    const res = await Promise.race([
      device.transferIn(inEp.endpointNumber, length),
      new Promise((_, reject) => setTimeout(() => reject(new Error('transferIn timeout')), timeoutMs))
    ]);
    if (!res || !res.data) return new Uint8Array();
    const bytes = new Uint8Array(res.data.buffer, res.data.byteOffset, res.data.byteLength);
    log('transferIn <-', bytesToHexInline(bytes));
    return bytes;
  } catch (e) {
    return new Uint8Array();
  }
}

/* DUSB helpers (same as earlier) */
async function requestBufferSizeOnce() {
  log('Requesting buffer size (DUSB_RPKT_BUF_SIZE_REQ)...');
  const req = constructRawPacket({ type: v.rawPacketTypes.DUSB_RPKT_BUF_SIZE_REQ, data: new Uint8Array([0,0,4,0]) });
  await transferOutRaw(req);
  const resp = await transferInRaw(1200);
  if (!resp || resp.length === 0) throw new Error('No response to buffer size request');
  const parsed = destructRawPacket(resp);
  if (parsed.type !== v.rawPacketTypes.DUSB_RPKT_BUF_SIZE_ALLOC) throw new Error('Unexpected buf response type ' + parsed.type);
  const size = bytesToInt(parsed.data);
  bufferSize = size;
  log('Buffer size allocated:', size);
  return size;
}
async function sendVirtualPacket(vtype, payloadBytes) {
  const virtual = constructVirtualPacket({ type: vtype, data: payloadBytes || [] });
  const payloadMax = bufferSize - v.rawPacketTypes.HEADER_SIZE;
  const chunks = chunkArray(virtual, [payloadMax]);
  for (let i=0;i<chunks.length;i++){
    const isLast = (i === chunks.length - 1);
    const rawType = isLast ? v.rawPacketTypes.DUSB_RPKT_VIRT_DATA_LAST : v.rawPacketTypes.DUSB_RPKT_VIRT_DATA;
    const rawPacket = constructRawPacket({ type: rawType, data: chunks[i] });
    await transferOutRaw(rawPacket);
    const ack = await transferInRaw(1200);
    if (!ack || ack.length === 0) throw new Error('No ACK received after sending chunk');
    const ackParsed = destructRawPacket(ack);
    if (ackParsed.type !== v.rawPacketTypes.DUSB_RPKT_VIRT_DATA_ACK) {
      throw new Error('Expected ACK type ' + v.rawPacketTypes.DUSB_RPKT_VIRT_DATA_ACK + ' got ' + ackParsed.type);
    }
    log('ACK received for chunk', (i+1)+'/'+chunks.length);
  }
}
async function readVirtualResponseHonoringDelay(totalTimeoutMs = 5000) {
  const deadline = Date.now() + totalTimeoutMs;
  while (Date.now() < deadline) {
    const raw = await transferInRaw(Math.max(200, deadline - Date.now()));
    if (!raw || raw.length === 0) continue;
    const parsed = destructRawPacket(raw);
    if (parsed.type !== v.rawPacketTypes.DUSB_RPKT_VIRT_DATA && parsed.type !== v.rawPacketTypes.DUSB_RPKT_VIRT_DATA_LAST) {
      log('Received non-virtual raw type', parsed.type);
      continue;
    }
    const virt = destructVirtualPacket(parsed.data);
    log('Virtual packet type 0x' + virt.type.toString(16) + ' size=' + virt.data.length);
    if (virt.type === v.virtualPacketTypes.DUSB_VPKT_DELAY_ACK) {
      const ackPkt = constructRawPacket({ type: v.rawPacketTypes.DUSB_RPKT_VIRT_DATA_ACK, data: new Uint8Array([0xE0, 0]) });
      await transferOutRaw(ackPkt);
      const delay = bytesToInt(virt.data);
      const waitMs = Math.floor(delay / 1000);
      log('DELAY_ACK: delay=' + delay + ' -> wait ' + waitMs + ' ms');
      await new Promise(r => setTimeout(r, waitMs));
      continue;
    } else {
      const ackPkt = constructRawPacket({ type: v.rawPacketTypes.DUSB_RPKT_VIRT_DATA_ACK, data: new Uint8Array([0xE0, 0]) });
      await transferOutRaw(ackPkt);
      return virt;
    }
  }
  return null;
}

/* probe interfaces — FIXED: open device before selecting/claiming */
async function probeInterfaces() {
  if (!device) { log('No device chosen'); return null; }

  const autoRelease = $("autoClaim").checked;
  const trySelectAlt = $("trySelectAlt").checked;
  log('Starting interface/alternate probe (autoRelease=' + autoRelease + ' trySelectAlt=' + trySelectAlt + ')');

  // OPEN device first (important)
  if (!device.opened) {
    try {
      await device.open();
      log('Device opened.');
    } catch (e) {
      log('device.open() failed:', (e && e.message ? e.message : e));
      // if open fails, we can't proceed
      return null;
    }
  }

  // try to ensure a configuration is selected (selectConfiguration may throw if already active)
  if (device.configuration === null) {
    try {
      await device.selectConfiguration(1);
      log('Selected configuration 1');
    } catch (e) {
      log('selectConfiguration failed (continuing):', (e && e.message ? e.message : e));
    }
  }

  const configs = device.configurations || [device.configuration].filter(Boolean);
  for (const cfg of configs) {
    log('Inspecting configuration', cfg.configurationValue);
    for (const iface of cfg.interfaces || []) {
      log('Interface', iface.interfaceNumber, 'has alternates', iface.alternates.map(a=>a.alternateSetting).join(','));
      for (const alt of iface.alternates || []) {
        const inEndpoint = (alt.endpoints || []).find(e => e.direction === 'in');
        const outEndpoint = (alt.endpoints || []).find(e => e.direction === 'out');
        if (!inEndpoint || !outEndpoint) {
          log('Skipping iface', iface.interfaceNumber, 'alt', alt.alternateSetting, '- missing IN/OUT');
          continue;
        }
        log('Trying iface', iface.interfaceNumber, 'alt', alt.alternateSetting, 'IN=', inEndpoint.endpointNumber, 'OUT=', outEndpoint.endpointNumber, 'pktSize=', inEndpoint.packetSize || 'unknown');

        try {
          // select alternate if requested
          if (trySelectAlt && typeof device.selectAlternateInterface === 'function') {
            try {
              await device.selectAlternateInterface(iface.interfaceNumber, alt.alternateSetting);
              log('selectAlternateInterface succeeded for iface', iface.interfaceNumber, 'alt', alt.alternateSetting);
            } catch (e) {
              log('selectAlternateInterface failed for iface', iface.interfaceNumber, 'alt', alt.alternateSetting, ':', (e.message||e));
            }
          }

          try {
            await device.claimInterface(iface.interfaceNumber);
            log('Claimed interface', iface.interfaceNumber);
          } catch (e) {
            log('claimInterface failed for iface', iface.interfaceNumber, ':', (e.message||e));
            continue;
          }

          // locate endpoints from actual claimed configuration/alternate
          const selectedIface = device.configuration.interfaces.find(i=>i.interfaceNumber===iface.interfaceNumber) || iface;
          const selectedAlt = selectedIface.alternates.find(a=>a.alternateSetting === alt.alternateSetting) || alt;
          const selectedIn = selectedAlt.endpoints.find(e=>e.direction==='in');
          const selectedOut = selectedAlt.endpoints.find(e=>e.direction==='out');
          if (!selectedIn || !selectedOut) {
            log('After claim/select, endpoints not found - releasing interface');
            try { await device.releaseInterface(iface.interfaceNumber); } catch(_) {}
            continue;
          }

          inEp = selectedIn; outEp = selectedOut;
          endpointPacketSize = selectedIn.packetSize || 4096;
          currentIface = iface.interfaceNumber;
          currentAlt = alt.alternateSetting;

          // attempt buffer size request
          try {
            await requestBufferSizeOnce();
            log('Buffer request succeeded on iface', iface.interfaceNumber, 'alt', alt.alternateSetting);
            $("dir").disabled = false;
            $("reset").disabled = false;
            $("disconnect").disabled = false;
            return { iface: iface.interfaceNumber, alt: alt.alternateSetting };
          } catch (e) {
            log('Buffer request failed on iface', iface.interfaceNumber, 'alt', alt.alternateSetting, ':', (e.message||e));
            if (autoRelease) {
              try { await device.releaseInterface(iface.interfaceNumber); log('Released interface', iface.interfaceNumber); } catch(e2) { log('Release failed:', (e2.message||e2)); }
            }
          }
        } catch (err) {
          log('Error trying iface alt:', (err.message||err));
          try { await device.releaseInterface(iface.interfaceNumber); } catch(_) {}
        }
      }
    }
  }
  log('Probe finished: no working alternate found.');
  return null;
}

/* top-level flows (connect/probe/dir/reset/disconnect) */
$("connect").addEventListener('click', async () => {
  try {
    log('navigator.usb.requestDevice (PID 0xE008) ...');
    const dev = await navigator.usb.requestDevice({ filters: [{ vendorId: 0x0451, productId: 0xE008 }] });
    if (!dev) { log('No device selected'); return; }
    device = dev;
    deviceInfo.textContent = `${device.productName || 'TI Calculator'} — VID:0x${device.vendorId.toString(16)} PID:0x${device.productId.toString(16)}`;
    log('Device chosen:', device.productName || '(unnamed)');
    $("probe").disabled = false;
    $("disconnect").disabled = false;
    $("reset").disabled = false;
  } catch (e) {
    log('Chooser error/cancel:', (e && e.message ? e.message : e));
  }
});

$("probe").addEventListener('click', async () => {
  if (!device) { log('No device'); return; }
  try {
    const res = await probeInterfaces();
    if (res) log('Probe success: iface', res.iface, 'alt', res.alt, '- ready for DUSB flows');
    else log('Probe found no working alternate');
  } catch (e) {
    log('Probe error:', (e && e.message ? e.message : e));
  }
});

$("dir").addEventListener('click', async () => {
  if (!device) { log('No device'); return; }
  if (!inEp || !outEp) { log('No claimed endpoints — run Probe Interfaces first'); return; }
  try {
    try { await requestBufferSizeOnce(); } catch (e) { log('buffer request failed:', (e.message||e)); }

    log('Sending PING (mode negotiate NORMAL) ...');
    await sendVirtualPacket(v.virtualPacketTypes.DUSB_VPKT_PING, new Uint8Array(v.modes.DUSB_MODE_NORMAL));
    const modeResp = await readVirtualResponseHonoringDelay(4000);
    if (!modeResp) log('No MODE_SET response (mode negotiation may not have completed)');
    else log('Mode negotiation returned virtual type 0x' + modeResp.type.toString(16));

    log('Sending DIR_REQ ...');
    await sendVirtualPacket(v.virtualPacketTypes.DUSB_VPKT_DIR_REQ, new Uint8Array([]));

    log('Waiting for directory response ...');
    const virt = await readVirtualResponseHonoringDelay(8000);
    if (!virt) { log('No virtual response received'); return; }
    rawEl.value = hexDump(virt.data);

    if (virt.type === v.virtualPacketTypes.DUSB_VPKT_ERROR) {
      log('DUSB ERROR — data:', bytesToHexInline(virt.data));
    } else {
      // parse printable names
      const names = [];
      let cur = [];
      for (let i=0;i<virt.data.length;i++){
        const b = virt.data[i];
        if (b >= 32 && b <= 126) cur.push(String.fromCharCode(b));
        else { if (cur.length >= 3) names.push(cur.join('').trim()); cur = []; }
      }
      if (cur.length >= 3) names.push(cur.join('').trim());
      if (names.length) log('Parsed names: ' + names.join(', '));
      else log('No printable names parsed — paste the raw hex for analysis.');
    }
  } catch (e) {
    log('Directory flow error:', (e && e.message ? e.message : e));
  }
});

$("reset").addEventListener('click', async () => {
  if (!device) { log('No device'); return; }
  try {
    if (!device.opened) {
      await device.open();
      log('Device opened for reset.');
    }
    if (typeof device.reset === 'function') {
      await device.reset();
      log('device.reset() called.');
    } else {
      log('device.reset() not available in this browser build.');
    }
  } catch (e) {
    log('Reset error:', (e && e.message ? e.message : e));
  }
});

$("disconnect").addEventListener('click', async () => {
  if (!device) return;
  try { if (device.opened) await device.close(); } catch(e) { log('Close error:', (e && e.message ? e.message : e)); }
  device = null; inEp = outEp = null; currentIface = currentAlt = null;
  deviceInfo.textContent = 'No device';
  $("probe").disabled = true;
  $("dir").disabled = true;
  $("reset").disabled = true;
  $("disconnect").disabled = true;
  log('Disconnected and cleared state.');
});
</script>
</body>
</html>
