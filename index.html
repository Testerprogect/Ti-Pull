<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>TI-84 CE — ticalc-usb powered Web Link</title>
  <style>
    body{font-family:system-ui,Segoe UI,Roboto,Arial;margin:0;background:#f3f7ff;color:#0b2436}
    .app{max-width:980px;margin:28px auto;background:#fff;border-radius:10px;padding:18px;box-shadow:0 10px 30px rgba(20,40,80,.08)}
    header{display:flex;justify-content:space-between;align-items:center}
    h1{margin:0;font-size:18px}
    .controls{margin-top:14px;display:flex;gap:8px}
    button{padding:10px 14px;border-radius:8px;border:0;background:#3f61d7;color:#fff;font-weight:700;cursor:pointer}
    button.ghost{background:#fff;border:1px solid #e6edf9;color:#2b3a57}
    .log{margin-top:14px;background:#071426;color:#dbeeff;padding:12px;border-radius:8px;min-height:240px;white-space:pre-wrap;font-family:ui-monospace,monospace}
    .files{margin-top:12px}
    .file{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;border-radius:8px;border:1px solid #eef4fb;background:#fff;margin-top:8px}
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div>
        <h1>TI-84 CE — Web Link (uses ticalc-usb)</h1>
        <div style="font-size:13px;color:#516a80">Uses the upstream ticalc-usb implementation for protocol & transfer logic</div>
      </div>
      <div>
        <button id="connect">Connect</button>
        <button id="list" class="ghost" disabled>List Programs</button>
        <button id="disconnect" class="ghost" disabled>Disconnect</button>
      </div>
    </header>

    <div class="controls">
      <div id="deviceInfo" style="flex:1;color:#556b80">No device</div>
    </div>

    <div class="files" id="files"></div>

    <h3 style="margin-top:18px">Debug Log</h3>
    <div id="log" class="log">No activity yet.</div>
  </div>

  <!--
    Load the library bundle. If the CDN path is different for the ticalc-usb build,
    replace this src with the correct bundle URL (the repository's dist/ contains the build).
    Example CDN path used here (change if necessary):
  -->
  <script src="https://cdn.jsdelivr.net/gh/Timendus/ticalc-usb@master/dist/index.umd.js"></script>

  <script>
    // Best-effort page that calls the library APIs seen in the upstream repo.
    // The upstream repo exposes a "ticalc" object; we call the same functions.
    (async function(){
      const logEl = document.getElementById('log');
      const infoEl = document.getElementById('deviceInfo');
      const filesEl = document.getElementById('files');
      const connectBtn = document.getElementById('connect');
      const listBtn = document.getElementById('list');
      const disconnectBtn = document.getElementById('disconnect');

      function log(msg){
        const t = new Date().toLocaleTimeString();
        logEl.textContent += `[${t}] ${msg}\n`;
        logEl.scrollTop = logEl.scrollHeight;
        console.log(msg);
      }

      // Ensure the library loaded
      if (typeof window.ticalc === 'undefined' && typeof window.ticalcUsb === 'undefined') {
        log('ticalc-usb library did not load from the CDN URL. Check the script src and use the dist bundle from the repository.');
        connectBtn.disabled = true;
        return;
      }

      // The upstream bundle typically registers a global; try ticalc then fallback to ticalcUsb
      const ticalcLib = window.ticalc || window.ticalcUsb || window.ticalc_usbbundle || null;
      if (!ticalcLib) {
        log('Could not find the ticalc library global. The bundle shape may differ; check the dist UMD build.');
        connectBtn.disabled = true;
        return;
      }

      log('Library loaded; initializing...');
      try {
        await ticalcLib.init({ supportLevel: 'none' }); // init like upstream
        log('Library initialized.');
      } catch(e){
        log('init error: ' + (e && e.message ? e.message : e));
      }

      // Connect flow
      connectBtn.addEventListener('click', async () => {
        try {
          log('Requesting device (chooser) ...');
          await ticalcLib.choose();
          log('Chooser completed; if the device connected event handler runs, the UI will update.');
        } catch(e){
          log('User cancelled or chooser error: ' + (e && e.message ? e.message : e));
        }
      });

      // When the library fires connect events, update UI. The upstream module registers event handlers,
      // so we attempt to hook the model creation by listening to recorded devices (if exposed).
      // The upstream code calls addEventListener('connect', handler). We'll register our own.
      try {
        ticalcLib.addEventListener('connect', async (calc) => {
          // calc is the calculator wrapper object from the library
          try {
            // ensure the device is ready
            if (await calc.isReady()) {
              window.__calc = calc; // expose for console
              infoEl.textContent = `Connected: ${calc.name || '(calculator)'} — model ${calc.model || ''}`;
              log('Calculator connected: ' + (calc.name || calc.model || 'unknown'));
              listBtn.disabled = false;
              disconnectBtn.disabled = false;
            } else {
              log('Connected device not responding.');
            }
          } catch(err){
            log('connect handler error: ' + (err && err.message ? err.message : err));
          }
        });
      } catch(e){
        log('Could not register connect handler: ' + (e && e.message ? e.message : e));
      }

      // Disconnect handler
      try {
        ticalcLib.addEventListener('disconnect', (calc) => {
          log('Calculator disconnected.');
          infoEl.textContent = 'Disconnected';
          listBtn.disabled = true;
          disconnectBtn.disabled = true;
          filesEl.innerHTML = '';
        });
      } catch(e){
        log('Could not register disconnect handler: ' + (e && e.message ? e.message : e));
      }

      // List programs — uses the calculator wrapper's storage/dir API from the upstream library.
      listBtn.addEventListener('click', async () => {
        try {
          const calc = window.__calc;
          if (!calc) { log('No calculator instance available'); return; }

          log('Requesting storage details and directory from calculator (via library)...');
          // upstream exposes getStorageDetails(file) and likely a directory API; try both patterns gracefully
          let dir = null;
          if (typeof calc.getDirectory === 'function') {
            dir = await calc.getDirectory();
          } else if (typeof calc.list === 'function') {
            dir = await calc.list();
          } else if (typeof calc.getFileList === 'function') {
            dir = await calc.getFileList();
          } else {
            // fallback: ask storage details for an empty file to probe, or use the upstream helpers.
            log('No directory API detected on calculator wrapper. Inspect window.__calc in console to find available methods.');
            return;
          }

          if (!dir || !dir.length) {
            log('Directory empty or not returned.');
            filesEl.innerHTML = '<div class="note">No files found or directory not supported by this wrapper.</div>';
            return;
          }

          filesEl.innerHTML = '';
          for (const item of dir) {
            // items from library vary: name/type/size. Show best-effort.
            const name = item.name || item.filename || item.label || JSON.stringify(item);
            const row = document.createElement('div');
            row.className = 'file';
            const left = document.createElement('div');
            left.textContent = name;
            const btn = document.createElement('button');
            btn.textContent = 'Download';
            btn.onclick = async () => {
              log('Requesting download of ' + name);
              try {
                // Upstream exposes sendFile for host->calc; for calc->host many libs implement requestFile() or similar.
                if (typeof calc.requestFile === 'function') {
                  const buf = await calc.requestFile(item);
                  // create blob and trigger download
                  const blob = new Blob([buf], { type: 'application/octet-stream' });
                  const url = URL.createObjectURL(blob);
                  const a = document.createElement('a');
                  a.href = url;
                  a.download = (item.name || item.filename || name) + '.8xp';
                  document.body.appendChild(a); a.click(); a.remove();
                  URL.revokeObjectURL(url);
                  log('Download complete for ' + name);
                } else if (typeof calc.getFile === 'function') {
                  const buf = await calc.getFile(item);
                  const blob = new Blob([buf], { type: 'application/octet-stream' });
                  const url = URL.createObjectURL(blob);
                  const a = document.createElement('a');
                  a.href = url;
                  a.download = (item.name || item.filename || name) + '.8xp';
                  document.body.appendChild(a); a.click(); a.remove();
                  URL.revokeObjectURL(url);
                  log('Download complete for ' + name);
                } else {
                  log('No file-request API found on wrapper. Inspect wrapper methods (window.__calc).');
                }
              } catch (err) {
                log('Download error: ' + (err && err.message ? err.message : err));
              }
            };
            row.appendChild(left);
            row.appendChild(btn);
            filesEl.appendChild(row);
          }
        } catch (err) {
          log('List error: ' + (err && err.message ? err.message : err));
        }
      });

      // Disconnect button
      disconnectBtn.addEventListener('click', async () => {
        try {
          // If wrapper exposes a close/disconnect, call it
          const calc = window.__calc;
          if (calc && typeof calc.close === 'function') {
            await calc.close();
            log('Calculator wrapper closed.');
          } else if (state && state.device && state.device.close) {
            await state.device.close();
            log('Device closed.');
          } else {
            log('No explicit close available; you can remove device permissions in browser settings.');
          }
        } catch(e) {
          log('Disconnect error: ' + (e && e.message ? e.message : e));
        }
      });

      log('UI initialized. Click Connect to begin.');
    })();
  </script>
</body>
</html>
