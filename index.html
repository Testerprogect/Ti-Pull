<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>TI-84 CE DUSB Explorer</title>
  <style>
    :root{
      --bg:#eef4ff;
      --panel:#ffffff;
      --ink:#1f2a37;
      --muted:#607089;
      --accent:#2e5ef7;
      --accent-soft:#edf3ff;
      --border:#dfeaff;
      --logbg:#071b2c;
      --logfg:#dfeeff;
      --danger:#b82323;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      background:linear-gradient(135deg,#eef4ff 0%, #f8fbff 100%);
      color:var(--ink);
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
    }
    .app{
      max-width:1100px;
      margin:20px auto;
      padding:18px;
      background:var(--panel);
      border-radius:16px;
      box-shadow:0 14px 32px rgba(18,38,77,.08);
    }
    header{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:12px;
      flex-wrap:wrap;
      margin-bottom:12px;
    }
    h1{
      margin:0;
      font-size:20px;
    }
    .controls{
      display:flex;
      flex-wrap:wrap;
      gap:8px;
    }
    button{
      border:none;
      border-radius:10px;
      background:var(--accent);
      color:#fff;
      padding:9px 12px;
      font-weight:700;
      cursor:pointer;
      transition:filter .15s ease;
    }
    button:hover{filter:brightness(1.03)}
    button.secondary{
      background:#fff;
      color:var(--ink);
      border:1px solid var(--border);
    }
    button.danger{
      background:#fff;
      color:var(--danger);
      border:1px solid rgba(184,35,35,.18);
    }
    button:disabled{
      opacity:.55;
      cursor:not-allowed;
    }
    .status{
      color:var(--muted);
      font-size:13px;
      margin:4px 0 12px 0;
    }
    .vars{
      display:flex;
      flex-direction:column;
      gap:8px;
      margin-top:12px;
    }
    .var-row{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      background:#fff;
      border:1px solid var(--border);
      border-radius:10px;
      padding:8px 10px;
    }
    .var-name{
      font-family:ui-monospace,SFMono-Regular,Consolas,monospace;
      font-weight:600;
      overflow-wrap:anywhere;
    }
    .download-group{
      display:flex;
      flex-wrap:wrap;
      gap:6px;
      justify-content:flex-end;
    }
    .download-group button{
      padding:7px 10px;
      font-size:12px;
      border-radius:8px;
    }
    .log{
      margin-top:12px;
      background:var(--logbg);
      color:var(--logfg);
      border-radius:12px;
      padding:12px;
      min-height:260px;
      max-height:480px;
      overflow:auto;
      white-space:pre-wrap;
      font-family:ui-monospace,SFMono-Regular,Consolas,monospace;
      font-size:12px;
      line-height:1.45;
    }
    .raw{
      margin-top:12px;
      width:100%;
      min-height:150px;
      resize:vertical;
      font-family:ui-monospace,SFMono-Regular,Consolas,monospace;
      font-size:12px;
      border:1px solid var(--border);
      border-radius:10px;
      background:#f9fbff;
      padding:10px;
      color:#203249;
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <h1>TI-84 CE DUSB Explorer</h1>
      <div class="controls">
        <button id="connectBtn">Connect</button>
        <button id="probeBtn" class="secondary" disabled>Probe Interfaces</button>
        <button id="dirBtn" class="secondary" disabled>Get Directory</button>
        <button id="disconnectBtn" class="danger" disabled>Disconnect</button>
      </div>
    </header>

    <div id="deviceInfo" class="status">No device</div>

    <div id="vars" class="vars"></div>

    <h3 style="margin:12px 0 0 0;">Debug Log</h3>
    <div id="log" class="log">No activity yet. Use: Connect → Probe Interfaces → Get Directory → Download.</div>

    <h3 style="margin:12px 0 0 0;">Latest raw data</h3>
    <textarea id="raw" class="raw" readonly placeholder="Raw data will appear here"></textarea>
  </div>

  <script>
    "use strict";

    const logEl = document.getElementById("log");
    const rawEl = document.getElementById("raw");
    const varsEl = document.getElementById("vars");
    const deviceInfo = document.getElementById("deviceInfo");

    const HELPER = {
      toHex(bytes) {
        if (!bytes) return "";
        return Array.from(bytes).map(b => b.toString(16).padStart(2, "0").toUpperCase()).join(" ");
      },
      hexDump(bytes, width = 16) {
        if (!bytes || bytes.length === 0) return "(empty)";
        let out = "";
        for (let i = 0; i < bytes.length; i += width) {
          const chunk = bytes.slice(i, i + width);
          const hex = Array.from(chunk).map(b => b.toString(16).padStart(2, "0").toUpperCase()).join(" ");
          const ascii = Array.from(chunk)
            .map(b => (b >= 32 && b <= 126 ? String.fromCharCode(b) : "."))
            .join("");
          out += i.toString(16).padStart(8, "0") + "  " + hex.padEnd(width * 3 - 1, " ") + "  " + ascii + "\n";
        }
        return out;
      },
      intToLE(num, size) {
        const out = new Uint8Array(size);
        for (let i = 0; i < size; i++) {
          out[i] = (num >>> (8 * i)) & 0xFF;
        }
        return out;
      },
      bytesToIntLE(bytes) {
        let out = 0;
        for (let i = 0; i < bytes.length; i++) {
          out |= (bytes[i] & 0xFF) << (8 * i);
        }
        return out;
      },
      asciiToBytes(str) {
        return new TextEncoder().encode(str);
      },
      decodeNameFromHeader(hdr) {
        const b = hdr || new Uint8Array();
        if (b.length === 0) return "(empty)";
        // Standard pattern: [00][len][name...]
        if (b.length >= 2 && b[0] === 0x00 && b[1] > 0 && b[1] <= 32) {
          const len = b[1];
          const slice = b.slice(2, 2 + len);
          const s = new TextDecoder("utf-8").decode(slice).replace(/\0+$/, "");
          if (s) return s;
        }
        // Try printable strings
        let best = "";
        let cur = "";
        for (let i = 0; i < b.length; i++) {
          const v = b[i];
          if (v >= 32 && v <= 126) {
            cur += String.fromCharCode(v);
          } else {
            if (cur.length > best.length) best = cur;
            cur = "";
          }
        }
        if (cur.length > best.length) best = cur;
        if (best) return best;
        return "(unknown)";
      }
    };

    const PACKET = {
      RAW: {
        REQ_BUF: 0x01,
        ALLOC_BUF: 0x02,
        VIRT: 0x03,
        VIRT_LAST: 0x04,
        ACK: 0x05
      },
      VIRT: {
        PING: 0x0001,
        DIR_REQ: 0x0009,
        VAR_HDR: 0x000A,
        RTS: 0x000B,
        VAR_REQ: 0x000C,
        VAR_CNTS: 0x000D,
        MODE_SET: 0x0012,
        EOT: 0xDD00,
        ERROR: 0xEE00,
        DELAY_ACK: 0xBB00
      }
    };

    function log(...parts) {
      const line = parts
        .map(p => {
          if (p instanceof Uint8Array) return HELPER.toHex(p);
          if (p instanceof ArrayBuffer) return HELPER.toHex(new Uint8Array(p));
          if (typeof p === "string") return p;
          if (typeof p === "number") return String(p);
          try { return JSON.stringify(p); } catch { return String(p); }
        })
        .join(" ");
      logEl.textContent += `[${new Date().toLocaleTimeString()}] ${line}\n`;
      logEl.scrollTop = logEl.scrollHeight;
    }

    let device = null;
    let inEp = null;
    let outEp = null;
    let bufferSize = 1023;
    let discovered = [];

    function setButtons() {
      document.getElementById("probeBtn").disabled = !device;
      document.getElementById("dirBtn").disabled = !device;
      document.getElementById("disconnectBtn").disabled = !device;
    }

    function makeRawPacket(type, payload) {
      const data = payload || new Uint8Array(0);
      const out = new Uint8Array(5 + data.length);
      out.set(HELPER.intToLE(data.length, 4), 0);
      out[4] = type & 0xFF;
      out.set(data, 5);
      return out;
    }

    function parseRawPacket(raw) {
      if (!raw || raw.length < 5) return { size: 0, type: 0, data: new Uint8Array(0) };
      const size = HELPER.bytesToIntLE(raw.slice(0, 4));
      const type = raw[4];
      const data = raw.slice(5, 5 + size);
      return { size, type, data };
    }

    function makeVirtPacket(type, payload) {
      const data = payload || new Uint8Array(0);
      const out = new Uint8Array(6 + data.length);
      out.set(HELPER.intToLE(data.length, 4), 0);
      out.set(HELPER.intToLE(type, 2), 4);
      out.set(data, 6);
      return out;
    }

    function parseVirtPacket(raw) {
      if (!raw || raw.length < 6) return { size: 0, type: 0, data: new Uint8Array(0) };
      const size = HELPER.bytesToIntLE(raw.slice(0, 4));
      const type = HELPER.bytesToIntLE(raw.slice(4, 6));
      const data = raw.slice(6, 6 + size);
      return { size, type, data };
    }

    async function transferOut(bytes) {
      if (!device || !outEp) throw new Error("No USB OUT endpoint");
      await device.transferOut(outEp.endpointNumber, bytes);
      log("transferOut ->", bytes);
    }

    async function transferIn(timeoutMs = 1500) {
      if (!device || !inEp) return new Uint8Array();
      try {
        const result = await Promise.race([
          device.transferIn(inEp.endpointNumber, inEp.packetSize || 64),
          new Promise((_, reject) => setTimeout(() => reject(new Error("timeout")), timeoutMs))
        ]);
        if (!result || !result.data) return new Uint8Array();
        const data = new Uint8Array(result.data.buffer, result.data.byteOffset, result.data.byteLength);
        log("transferIn <-", data);
        return data;
      } catch (e) {
        log("transferIn error:", e && e.message ? e.message : e);
        return new Uint8Array();
      }
    }

    async function readVirtualResponse(timeoutMs = 4000) {
      const deadline = Date.now() + timeoutMs;
      while (Date.now() < deadline) {
        const raw = await transferIn(Math.max(200, deadline - Date.now()));
        if (!raw || raw.length === 0) continue;

        const parsed = parseRawPacket(raw);
        if (parsed.type !== PACKET.RAW.VIRT && parsed.type !== PACKET.RAW.VIRT_LAST) {
          continue;
        }

        const virt = parseVirtPacket(parsed.data);
        if (virt && virt.type === PACKET.VIRT.DELAY_ACK) {
          const waitMs = Math.max(100, HELPER.bytesToIntLE(virt.data));
          log("DELAY_ACK — wait", waitMs, "ms");
          await new Promise(r => setTimeout(r, waitMs));
          continue;
        }

        // ACK the packet after parsing
        const ack = makeRawPacket(PACKET.RAW.ACK, new Uint8Array([0xE0, 0x00]));
        await transferOut(ack);

        return virt;
      }
      return null;
    }

    async function waitForAck(timeoutMs = 3000) {
      const deadline = Date.now() + timeoutMs;
      while (Date.now() < deadline) {
        const raw = await transferIn(Math.max(200, deadline - Date.now()));
        if (!raw || raw.length === 0) continue;
        const parsed = parseRawPacket(raw);
        if (parsed.type === PACKET.RAW.ACK) {
          log("Chunk ACK raw received");
          return true;
        }
      }
      return false;
    }

    async function sendVirtualPacket(type, payload) {
      const data = payload || new Uint8Array(0);
      const chunkSize = Math.max(1, (bufferSize || 1023) - 6);

      const chunks = [];
      for (let i = 0; i < data.length; i += chunkSize) {
        chunks.push(data.slice(i, i + chunkSize));
      }
      if (chunks.length === 0) chunks.push(new Uint8Array(0));

      for (let i = 0; i < chunks.length; i++) {
        const chunk = chunks[i];
        const last = i === chunks.length - 1;
        const rawType = last ? PACKET.RAW.VIRT_LAST : PACKET.RAW.VIRT;
        const rawPacket = makeRawPacket(rawType, makeVirtPacket(type, chunk));
        await transferOut(rawPacket);
        const ack = await waitForAck(2000);
        if (!ack) {
          log("No ACK after virtual packet chunk");
          return false;
        }
      }
      return true;
    }

    async function requestBufferSize() {
      log("Requesting buffer size (DUSB_RPKT_BUF_SIZE_REQ)...");
      const req = makeRawPacket(PACKET.RAW.REQ_BUF, new Uint8Array([0x00, 0x00, 0x00, 0x04, 0x00]));
      await transferOut(req);
      const resp = await transferIn(2000);
      const parsed = parseRawPacket(resp);
      if (parsed.type !== PACKET.RAW.ALLOC_BUF) {
        throw new Error("Unexpected buffer response type " + parsed.type);
      }
      bufferSize = HELPER.bytesToIntLE(parsed.data);
      log("Buffer size allocated:", bufferSize);
    }

    async function probeInterfaces() {
      if (!device) return null;

      log("Opening device and probing interfaces...");
      try {
        if (!device.opened) await device.open();
        log("Device opened.");
      } catch (e) {
        log("device.open failed:", e && e.message ? e.message : e);
      }

      try {
        if (!device.configuration) {
          await device.selectConfiguration(1);
        }
        log("Inspecting configuration 1");
      } catch (e) {
        log("selectConfiguration failed:", e && e.message ? e.message : e);
      }

      const interfaces = device.configurations ? device.configurations[0].interfaces || [] : [];
      for (const iface of interfaces) {
        const alt = iface.alternates && iface.alternates[0];
        if (!alt) continue;
        const inEp = (alt.endpoints || []).find(e => e.direction === "in");
        const outEpCandidate = (alt.endpoints || []).find(e => e.direction === "out");
        if (!inEp || !outEpCandidate) continue;

        log("Trying iface", iface.interfaceNumber, "alt", alt.alternateSetting, "IN=", inEp.endpointNumber, "OUT=", outEpCandidate.endpointNumber, "pktSize=", inEp.packetSize || 64);

        try {
          await device.claimInterface(iface.interfaceNumber);
          log("Claimed interface", iface.interfaceNumber);
        } catch (e) {
          log("claimInterface failed:", e && e.message ? e.message : e);
          continue;
        }

        try {
          inEp = inEp;
          outEp = outEpCandidate;
          await requestBufferSize();
          log("Buffer ok on iface", iface.interfaceNumber);
          log("Probe success:", { iface: iface.interfaceNumber, alt: alt.alternateSetting });
          return { iface: iface.interfaceNumber, alt: alt.alternateSetting };
        } catch (e) {
          log("interface setup failed:", e && e.message ? e.message : e);
          try { await device.releaseInterface(iface.interfaceNumber); } catch (_) {}
        }
      }

      log("Probe finished: no usable interface");
      return null;
    }

    function addVarRow(name, hdr) {
      const row = document.createElement("div");
      row.className = "var-row";

      const varName = document.createElement("div");
      varName.className = "var-name";
      varName.textContent = name;

      const group = document.createElement("div");
      group.className = "download-group";

      const btnA = document.createElement("button");
      btnA.textContent = ".8xp";
      btnA.onclick = () => downloadVariable(name, hdr, "8xp");

      const btnB = document.createElement("button");
      btnB.textContent = ".txt";
      btnB.onclick = () => downloadVariable(name, hdr, "txt");

      const btnC = document.createElement("button");
      btnC.textContent = "raw";
      btnC.onclick = () => downloadVariable(name, hdr, "raw");

      group.appendChild(btnA);
      group.appendChild(btnB);
      group.appendChild(btnC);

      row.appendChild(varName);
      row.appendChild(group);

      varsEl.appendChild(row);
    }

    function renderVars() {
      varsEl.innerHTML = "";
      for (const item of discovered) {
        addVarRow(item.name, item.hdr);
      }
    }

    function textFromVarData(data) {
      if (!data || data.length === 0) return "";
      // mostly printable ASCII
      let good = 0;
      for (let i = 0; i < data.length; i++) {
        const b = data[i];
        if ((b >= 32 && b <= 126) || b === 9 || b === 10 || b === 13) good++;
      }
      if (good / data.length > 0.75) {
        return new TextDecoder("ascii").decode(data);
      }
      return "TI-84 variable dump (hex):\n\n" + Array.from(data).map(v => v.toString(16).padStart(2, "0").toUpperCase()).join(" ");
    }

    function create8xpFromProgramData(name, data) {
      const nameBytes = HELPER.asciiToBytes(name);
      const out = new Uint8Array(9 + nameBytes.length + 1 + 4 + (data || []).length);
      let p = 0;

      const sig = [0x89, 0x38, 0x50, 0x58, 0x41, 0x00, 0x00, 0x00, 0x00];
      for (const v of sig) out[p++] = v;
      out[p++] = 0x00;
      out[p++] = 0x00;
      out[p++] = nameBytes.length;
      out.set(nameBytes, p);
      p += nameBytes.length;
      out[p++] = 0x00;

      const len = HELPER.intToLE((data || []).length, 4);
      out.set(len, p);
      p += 4;
      out.set(data || new Uint8Array(0), p);
      return out;
    }

    function saveBlob(filename, bytes, mimeType) {
      const blob = new Blob([bytes], { type: mimeType });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
    }

    async function downloadVariable(name, hdr, format) {
      log("Download request for:", name, "format:", format);

      const content = await readVariablePayload(name, hdr);
      if (!content || content.length === 0) {
        log("No data returned for", name);
        return;
      }

      if (format === "8xp") {
        const boxed = create8xpFromProgramData(name, content);
        saveBlob(name + ".8xp", boxed, "application/octet-stream");
        log("Saved", name + ".8xp");
        return;
      }

      if (format === "txt") {
        const txt = textFromVarData(content);
        saveBlob(name + ".txt", new TextEncoder().encode(txt), "text/plain;charset=utf-8");
        log("Saved", name + ".txt");
        return;
      }

      saveBlob(name + ".bin", content, "application/octet-stream");
      log("Saved", name + ".bin");
    }

    function buildVarReqCandidates(name) {
      const seed = HELPER.asciiToBytes(name);
      const out = [];
      const seen = new Set();

      function add(data, label) {
        const key = HELPER.toHex(data);
        if (!seen.has(key)) {
          seen.add(key);
          out.push({ label, data });
        }
      }

      add(seed, "name_only");
      add(new Uint8Array([seed.length & 0xFF, 0x00, ...seed]), "name_len_name");
      add(new Uint8Array([0x05, seed.length & 0xFF, ...seed]), "type05_nameLen_name");
      add(new Uint8Array([0x0B, 0x00, 0x05, 0x00, ...seed, 0x00, 0x00, 0x00]), "vt5_name");
      add(new Uint8Array([0x0B, 0x00, 0x15, 0x00, ...seed, 0x00, 0x00, 0x00]), "vt21_name");
      add(new Uint8Array([0x0B, 0x00, 0x01, 0x00, ...seed, 0x00, 0x00, 0x00]), "vt1_name");

      return out;
    }

    async function gatherReadResponse(timeoutMs = 12000) {
      const deadline = Date.now() + timeoutMs;
      const parts = [];

      while (Date.now() < deadline) {
        const raw = await transferIn(Math.max(200, deadline - Date.now()));
        if (!raw || raw.length === 0) continue;

        const parsed = parseRawPacket(raw);
        if (parsed.type !== PACKET.RAW.VIRT && parsed.type !== PACKET.RAW.VIRT_LAST) {
          continue;
        }

        const virt = parseVirtPacket(parsed.data);
        if (!virt || virt.type === PACKET.VIRT.ERROR) {
          log("ERROR while reading:", virt ? virt.data : parsed.data);
          break;
        }

        if (virt.type === PACKET.VIRT.EOT || virt.type === PACKET.VIRT.DELAY_ACK) {
          if (virt.type === PACKET.VIRT.DELAY_ACK) {
            const waitMs = HELPER.bytesToIntLE(virt.data);
            log("DELAY_ACK — wait", waitMs, "ms");
            await new Promise(r => setTimeout(r, waitMs));
          } else {
            log("EOT received");
          }
          continue;
        }

        if (virt.data && virt.data.length > 0) {
          parts.push(new Uint8Array(virt.data));
        }
      }

      const total = parts.reduce((sum, p) => sum + p.length, 0);
      if (total === 0) return null;
      const out = new Uint8Array(total);
      let p = 0;
      for (const part of parts) {
        out.set(part, p);
        p += part.length;
      }
      return out;
    }

    async function readVariablePayload(name, hdr) {
      const modes = [
        { label: "NORMAL", payload: new Uint8Array([0x00,0x00,0x00,0x00,0x0A,0x00,0x01,0x00,0x03,0x00,0x01,0x00,0x00,0x00,0x00,0x07,0xD0]) },
        { label: "BASIC", payload: new Uint8Array([0x00,0x00,0x00,0x00,0x0A,0x00,0x01,0x00,0x02,0x00,0x01,0x00,0x00,0x00,0x00,0x07,0xD0]) },
        { label: "STARTUP", payload: new Uint8Array([0x00,0x00,0x00,0x00,0x0A,0x00,0x01,0x00,0x01,0x00,0x01,0x00,0x00,0x00,0x00,0x07,0xD0]) }
      ];

      const candidates = buildVarReqCandidates(name);

      for (const mode of modes) {
        log("Trying mode", mode.label, "for VAR_REQ read");
        try {
          const ok = await sendVirtualPacket(PACKET.VIRT.PING, mode.payload);
          if (!ok) {
            log("PING failed in mode", mode.label);
            continue;
          }
          const resp = await readVirtualResponse(3000);
          if (resp) {
            log("Mode negotiation returned virtual type 0x" + resp.type.toString(16));
          }

          for (const cand of candidates) {
            log("Attempting VAR_REQ candidate", cand.label, HELPER.toHex(cand.data));
            try {
              const sent = await sendVirtualPacket(PACKET.VIRT.VAR_REQ, cand.data);
              if (!sent) continue;
              const data = await gatherReadResponse(12000);
              if (data && data.length > 0) {
                log("Data succeeded for", name, "in mode", mode.label, "candidate", cand.label);
                return data;
              }
            } catch (e) {
              log("VAR_REQ candidate failed:", cand.label, e && e.message ? e.message : e);
            }
          }
        } catch (e) {
          log("Mode failed:", mode.label, e && e.message ? e.message : e);
        }
      }

      log("All read attempts failed for", name);
      return null;
    }

    async function doGetDirectory() {
      if (!device || !inEp || !outEp) {
        log("Device not ready");
        return;
      }

      discovered = [];
      varsEl.innerHTML = "";

      log("Sending PING (mode NORMAL) ...");
      await sendVirtualPacket(PACKET.VIRT.PING, new Uint8Array([0x00,0x00,0x00,0x00,0x0A,0x00,0x01,0x00,0x03,0x00,0x01,0x00,0x00,0x00,0x00,0x07,0xD0]));
      const pingResp = await readVirtualResponse(4000);
      if (pingResp) {
        log("Mode virt type 0x" + pingResp.type.toString(16));
      }

      log("Sending DIR_REQ ...");
      await sendVirtualPacket(PACKET.VIRT.DIR_REQ, new Uint8Array(0));

      const deadline = Date.now() + 9000;
      while (Date.now() < deadline) {
        const virt = await readVirtualResponse(Math.max(200, deadline - Date.now()));
        if (!virt) break;

        rawEl.value = HELPER.hexDump(virt.data);

        if (virt.type === PACKET.VIRT.VAR_HDR) {
          const name = HELPER.decodeNameFromHeader(virt.data);
          log("Found variable:", name, "hdr=", HELPER.toHex(virt.data));
          discovered.push({ name, hdr: new Uint8Array(virt.data) });
          renderVars();
        } else if (virt.type === PACKET.VIRT.EOT) {
          log("Directory EOT");
          break;
        } else if (virt.type === PACKET.VIRT.ERROR) {
          log("Directory ERROR:", HELPER.toHex(virt.data));
          break;
        }
      }
    }

    document.getElementById("connectBtn").addEventListener("click", async () => {
      try {
        log("navigator.usb.requestDevice (PID 0xE008) ...");
        const chosen = await navigator.usb.requestDevice({
          filters: [{ vendorId: 0x0451, productId: 0xE008 }]
        });
        if (!chosen) {
          log("No device selected");
          return;
        }

        device = chosen;
        deviceInfo.textContent = `${device.productName || "TI-84 Plus CE"} — VID:0x${device.vendorId.toString(16).toUpperCase()} PID:0x${device.productId.toString(16).toUpperCase()}`;
        log("Device chosen:", device.productName || "TI-84 Plus CE");

        try {
          await device.open();
          log("Device opened.");
        } catch (e) {
          log("device.open failed:", e && e.message ? e.message : e);
        }

        const interfaces = device.configurations ? (device.configurations[0] && device.configurations[0].interfaces) || [] : [];
        for (const iface of interfaces) {
          const alt = iface.alternates && iface.alternates[0];
          if (!alt) continue;
          const inEP = (alt.endpoints || []).find(e => e.direction === "in");
          const outEP = (alt.endpoints || []).find(e => e.direction === "out");
          if (!inEP || !outEP) continue;

          try {
            await device.claimInterface(iface.interfaceNumber);
            log("Claimed interface", iface.interfaceNumber);
            inEp = inEP;
            outEp = outEP;
            break;
          } catch (e) {
            log("select/claim failed:", e && e.message ? e.message : e);
          }
        }

        setButtons();
      } catch (e) {
        log("navigator.usb.requestDevice failed:", e && e.message ? e.message : e);
      }
    });

    document.getElementById("probeBtn").addEventListener("click", async () => {
      if (!device) return;
      await probeInterfaces();
      setButtons();
    });

    document.getElementById("dirBtn").addEventListener("click", async () => {
      if (!device) return;
      await doGetDirectory();
      setButtons();
    });

    document.getElementById("disconnectBtn").addEventListener("click", async () => {
      if (!device) return;
      try {
        if (device.opened) await device.close();
      } catch (e) {
        log("Close error:", e && e.message ? e.message : e);
      }
      device = null;
      inEp = null;
      outEp = null;
      discovered = [];
      renderVars();
      deviceInfo.textContent = "No device";
      setButtons();
      log("Disconnected");
    });

    setButtons();
    log("Page loaded. Use: Connect → Probe Interfaces → Get Directory → Download.");
  </script>
</body>
</html>
